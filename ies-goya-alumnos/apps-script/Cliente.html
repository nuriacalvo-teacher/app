<script>
/* =====================================================================
   ARCHIVO HISTÓRICO DEL IES GOYA · Interfaz (navegador)
   ===================================================================== */
'use strict';

const S = {
  token: null,
  usuario: null,
  ajustes: {},
  campos: [],
  profesores: [],
  carpetas: [],
  epocas: [],
  epoca: null,           // código de la época en la que se trabaja (XIX, 1900_1930…)
  vista: null,
  sucio: false,          // hay cambios sin guardar en el formulario
  edicion: null,         // {id, version, registro} cuando se modifica un expediente
  pegajosos: {},         // valores que se mantienen al pulsar «Guardar y nuevo»
  latido: null,          // renovación del aviso «en edición»
  localidades: {},       // localidades ya usadas, por provincia
  busqueda: { q: '', filtros: {}, orden: 'apellidos', pagina: 1, papelera: false, soloMios: false, todas: false },
  indice: { letra: 'A', pagina: 1 }
};

const ROLES = { NINGUNO: 0, LECTOR: 1, EDITOR: 2, ADMIN: 3 };
const TIPOS = {
  texto: 'Texto corto', texto_largo: 'Texto largo', numero: 'Número', fecha: 'Fecha (dd/mm/aaaa, mm/aaaa o año)',
  seleccion: 'Lista de opciones', si_no: 'Sí / No', profesor: 'Profesor/a (lista)', carpeta: 'Carpeta (lista)',
  pais: 'País', provincia: 'Provincia', localidad: 'Localidad'
};
const NOMBRES_ROL = { ADMIN: 'Coordinación', EDITOR: 'Editor/a', LECTOR: 'Sólo consulta' };

/* ---------- Utilidades ---------- */

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const puede = (rol) => S.usuario && ROLES[S.usuario.rol] >= ROLES[rol];
const claseEstado = (e) => 'e-' + sinAcentos(e).replace(/\s+/g, '-');
const etiquetaEstado = (e) => e ? `<span class="etiqueta ${claseEstado(e)}">${esc(e)}</span>` : '';
const numero = (n) => Number(n || 0).toLocaleString('es-ES');

function debounce(fn, ms) {
  let t;
  return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

function sinAcentos(s) {
  return String(s || '').toUpperCase().replace(/Ñ/g, '\u0001').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\u0001/g, 'Ñ');
}

/** Igual que en el servidor: orden alfabético español ignorando la conjunción «Y». */
function claveOrden(s) {
  return sinAcentos(s).replace(/[^A-ZÑ0-9 ]/g, ' ').replace(/(^| )Y(?= |$)/g, ' ').replace(/\s+/g, ' ').trim().replace(/Ñ/g, 'N{');
}

function guardarLocal(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) { /* sin almacenamiento */ } }
function leerLocal(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

/** Llama al servidor (Apps Script). */
function api(accion, datos) {
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler((txt) => {
        let r;
        try { r = JSON.parse(txt); } catch (e) { return reject(new Error('Respuesta no válida del servidor.')); }
        if (r.ok) return resolve(r.data);
        if (r.sesion) { S.token = null; guardarLocal('goya_token', null); mostrarPantalla('login'); }
        reject(new Error(r.error || 'Error desconocido.'));
      })
      .withFailureHandler((e) => reject(new Error((e && e.message) || 'No se ha podido conectar con el servidor.')))
      .api(accion, Object.assign({ epoca: S.epoca }, datos || {}), S.token);
  });
}

function aviso(msg, tipo = 'ok') {
  const iconos = { ok: 'check-circle-fill text-success', error: 'exclamation-octagon-fill text-danger', info: 'info-circle-fill text-primary', aviso: 'exclamation-triangle-fill text-warning' };
  const el = document.createElement('div');
  el.className = 'toast align-items-center border-0 shadow';
  el.setAttribute('role', 'status');
  el.innerHTML = `<div class="d-flex"><div class="toast-body d-flex gap-2"><i class="bi bi-${iconos[tipo] || iconos.info}"></i><div>${esc(msg)}</div></div>
    <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button></div>`;
  $('#avisos').appendChild(el);
  const t = new bootstrap.Toast(el, { delay: tipo === 'error' ? 9000 : 4000 });
  el.addEventListener('hidden.bs.toast', () => el.remove());
  t.show();
}

function error(e) { aviso(e && e.message ? e.message : String(e), 'error'); }

const modalBs = () => bootstrap.Modal.getOrCreateInstance($('#modal'));

function abrirModal(titulo, cuerpo, pie = '', tam = 'lg') {
  $('#modal-titulo').innerHTML = titulo;
  $('#modal-cuerpo').innerHTML = cuerpo;
  $('#modal-pie').innerHTML = pie || '<button type="button" class="btn btn-light" data-bs-dismiss="modal">Cerrar</button>';
  $('#modal-pie').classList.toggle('d-none', pie === null);
  $('#modal .modal-dialog').className = 'modal-dialog modal-dialog-scrollable modal-fullscreen-sm-down' + (tam ? ' modal-' + tam : '');
  modalBs().show();
}

function cerrarModal() { modalBs().hide(); }

/** Ventana de confirmación. Devuelve una promesa con true/false. */
function confirmar(titulo, cuerpo, textoBoton = 'Confirmar', peligro = false) {
  return new Promise((resolve) => {
    const el = $('#modal-confirmar');
    $('#confirmar-titulo').textContent = titulo;
    $('#confirmar-cuerpo').innerHTML = cuerpo;
    const b = $('#confirmar-si');
    b.textContent = textoBoton;
    b.className = 'btn ' + (peligro ? 'btn-danger' : 'btn-primary');
    let res = false;
    const m = bootstrap.Modal.getOrCreateInstance(el);
    b.onclick = () => {
      const chk = $('[data-requerido]', el);
      if (chk && !chk.checked) { chk.classList.add('is-invalid'); return; }
      res = true; m.hide();
    };
    el.addEventListener('hidden.bs.modal', () => resolve(res), { once: true });
    m.show();
  });
}

function ocupado(boton, si, texto) {
  if (!boton) return;
  if (si) {
    boton.dataset.html = boton.innerHTML;
    boton.disabled = true;
    boton.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span> ${esc(texto || 'Guardando…')}`;
  } else {
    boton.disabled = false;
    if (boton.dataset.html) boton.innerHTML = boton.dataset.html;
  }
}

function paginacion(p, paginas, total, alCambiar) {
  const id = 'pag' + Math.random().toString(36).slice(2);
  setTimeout(() => {
    $$(`#${id} [data-pag]`).forEach((b) => b.addEventListener('click', () => alCambiar(parseInt(b.dataset.pag, 10))));
  });
  if (paginas <= 1) return `<div class="small text-suave px-3 py-2">${numero(total)} resultado${total === 1 ? '' : 's'}</div>`;
  return `<div class="d-flex flex-wrap align-items-center justify-content-between gap-2 px-3 py-2" id="${id}">
    <div class="small text-suave">${numero(total)} resultados · página ${p} de ${paginas}</div>
    <div class="btn-group btn-group-sm">
      <button class="btn btn-outline-secondary" data-pag="1" ${p === 1 ? 'disabled' : ''}><i class="bi bi-chevron-double-left"></i></button>
      <button class="btn btn-outline-secondary" data-pag="${p - 1}" ${p === 1 ? 'disabled' : ''}><i class="bi bi-chevron-left"></i> Anterior</button>
      <button class="btn btn-outline-secondary" data-pag="${p + 1}" ${p === paginas ? 'disabled' : ''}>Siguiente <i class="bi bi-chevron-right"></i></button>
      <button class="btn btn-outline-secondary" data-pag="${paginas}" ${p === paginas ? 'disabled' : ''}><i class="bi bi-chevron-double-right"></i></button>
    </div></div>`;
}

const epocaDeUid = (uid) => { const m = /^([A-Z0-9_]+)-R\d+$/.exec(String(uid || '')); return m ? m[1] : ''; };
const epocaPorCodigo = (c) => S.epocas.find((e) => e.CODIGO === c) || {};
const epocaActual = () => epocaPorCodigo(S.epoca);
const anosEpoca = (e) => (e.DESDE || e.HASTA ? `${e.DESDE || '…'}–${e.HASTA || '…'}` : '');
/** «Siglo XIX · 1845–1900», sin repetir los años si ya están en el nombre. */
const tituloEpoca = (e) => { const a = anosEpoca(e); return !a || String(e.NOMBRE).indexOf(a) >= 0 || /\d{4}/.test(e.NOMBRE || '') ? (e.NOMBRE || '') : `${e.NOMBRE} · ${a}`; };

/** Cambia la época de trabajo: carga sus carpetas y actualiza menú y cabecera. */
async function cambiarEpoca(codigo, navegar = true) {
  if (!codigo || codigo === S.epoca) return;
  S.epoca = codigo;
  guardarLocal('goya_epoca', codigo);
  S.busqueda.filtros = {};
  S.busqueda.pagina = 1;
  S.indice = { letra: 'A', pagina: 1 };
  S.localidades = {};
  try { S.carpetas = (await api('carpetas')).map(({ EXPEDIENTES, TERMINADOS, ...c }) => c); } catch (e) { error(e); }
  pintarCabecera();
  if (navegar) ir('inicio');
}

const campoPorClave = (k) => S.campos.find((c) => c.clave === k);
const camposActivos = () => S.campos.filter((c) => c.activo);
const etiquetaDe = (k) => (campoPorClave(k) || {}).etiqueta || k;

function textoCarpeta(num) {
  const c = S.carpetas.find((x) => x.NUMERO === String(num));
  if (!c) return String(num || '');
  return c.DESDE || c.HASTA ? `${c.NUMERO} · ${c.DESDE || '…'} – ${c.HASTA || '…'}` : c.NUMERO;
}

/** Carpeta cuyo rango de apellidos contiene los apellidos dados. */
function carpetaSugerida(apellidos) {
  const k = claveOrden(apellidos);
  if (!k) return null;
  return S.carpetas.find((c) => {
    if (!c.DESDE || !c.HASTA) return false;
    const d = claveOrden(c.DESDE), h = claveOrden(c.HASTA);
    return k >= d && (k <= h || k.startsWith(h));
  }) || null;
}

/* ---------- Arranque y pantallas ---------- */

function mostrarPantalla(cual) {
  ['carga', 'login', 'sin-acceso'].forEach((p) => $('#pantalla-' + p).classList.toggle('d-none', p !== cual));
  $('#app').classList.toggle('d-none', cual !== 'app');
}

async function arrancar() {
  S.token = leerLocal('goya_token');
  S.epoca = leerLocal('goya_epoca');
  mostrarPantalla('carga');
  try {
    const r = await api('arranque');
    S.usuario = r.usuario;
    if (!r.usuario.identificado) { mostrarPantalla('login'); setTimeout(() => $('#login-email').focus(), 50); return; }
    if (r.usuario.rol === 'NINGUNO') { $('#sin-acceso-email').textContent = r.usuario.email; mostrarPantalla('sin-acceso'); return; }
    Object.assign(S, { ajustes: r.ajustes, campos: r.campos, profesores: r.profesores, carpetas: r.carpetas, urlHoja: r.urlHoja, urlApp: r.urlApp,
      epocas: r.epocas, epoca: r.epoca });
    guardarLocal('goya_epoca', r.epoca);
    pintarCabecera();
    mostrarPantalla('app');
    ir(location.hash.replace('#', '') || 'portada');
  } catch (e) {
    mostrarPantalla('carga');
    $('#pantalla-carga').innerHTML = `<div class="tarjeta-acceso text-center"><div class="sello grande mb-3">G</div>
      <h1 class="h5 fw-bold">No se ha podido abrir el archivo</h1><p class="text-suave small">${esc(e.message)}</p>
      <button class="btn btn-outline-primary" onclick="location.reload()">Reintentar</button></div>`;
  }
}

function pintarCabecera() {
  const u = S.usuario;
  $$('[data-nombre-app]').forEach((el) => { el.textContent = S.ajustes.NOMBRE_APP || 'Archivo histórico del IES Goya'; });
  const ep = epocaActual();
  $('#subtitulo-app').textContent = ep.NOMBRE ? tituloEpoca(ep) : (S.ajustes.SUBTITULO || '');
  $('#sel-epoca').innerHTML = S.epocas.map((e) => `<option value="${esc(e.CODIGO)}"${e.CODIGO === S.epoca ? ' selected' : ''}>${esc(e.NOMBRE)}${e.ESTADO === 'CERRADA' ? ' · cerrada' : ''}</option>`).join('');
  document.title = S.ajustes.NOMBRE_APP || document.title;
  const iniciales = (u.nombre || u.email).split(/[\s@.]+/).filter(Boolean).slice(0, 2).map((s) => s[0]).join('').toUpperCase();
  $('#usuario-avatar').textContent = iniciales;
  $('#usuario-nombre').textContent = u.nombre;
  $('#usuario-nombre-2').textContent = u.nombre;
  $('#usuario-email').textContent = u.email;
  $('#usuario-rol').textContent = NOMBRES_ROL[u.rol];
  $('#usuario-rol').className = 'rol mt-1 d-inline-block rol-' + u.rol;
  $('#item-salir').classList.toggle('d-none', u.via !== 'codigo');
  $$('[data-rol]').forEach((el) => el.classList.toggle('d-none', !puede(el.dataset.rol)));
}

$('#form-login').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const b = $('#login-boton');
  $('#login-error').classList.add('d-none');
  ocupado(b, true, 'Comprobando…');
  try {
    const r = await api('login', { email: $('#login-email').value, codigo: $('#login-codigo').value });
    S.token = r.token;
    guardarLocal('goya_token', r.token);
    await arrancar();
  } catch (e) {
    $('#login-error').textContent = e.message;
    $('#login-error').classList.remove('d-none');
  } finally { ocupado(b, false); }
});

$('#btn-salir').addEventListener('click', async (ev) => {
  ev.preventDefault();
  try { await api('logout', { token: S.token }); } catch (e) { /* da igual */ }
  S.token = null;
  guardarLocal('goya_token', null);
  location.reload();
});

$('#sel-epoca').addEventListener('change', async (ev) => {
  const nueva = ev.target.value;
  if (S.sucio && !(await confirmar('Hay cambios sin guardar', '<p>Si cambias de época perderás lo que has escrito en el formulario.</p>', 'Cambiar de época', true))) {
    ev.target.value = S.epoca; return;
  }
  S.sucio = false;
  cambiarEpoca(nueva);
});

/* ---------- Navegación ---------- */

const VISTAS = {
  portada: vistaPortada, epocas: vistaEpocas,
  inicio: vistaInicio, nuevo: () => vistaFormulario(null), editar: (id) => vistaFormulario(id), buscar: vistaBuscar,
  indice: vistaIndice, carpetas: vistaCarpetas, campos: vistaCampos, profesores: vistaProfesores,
  historial: vistaHistorial, ajustes: vistaAjustes, ayuda: vistaAyuda
};

async function ir(destino, arg) {
  if (S.sucio && !(await confirmar('Hay cambios sin guardar', '<p>Si sales ahora perderás lo que has escrito en el formulario.</p>', 'Salir sin guardar', true))) return;
  salirDeEdicion();
  let [vista, param] = String(destino).split('/');
  if (!VISTAS[vista]) vista = 'portada';
  if (vista === 'nuevo' && !puede('EDITOR')) vista = 'inicio';
  if (['campos', 'profesores', 'historial', 'ajustes', 'epocas'].includes(vista) && !puede('ADMIN')) vista = 'portada';
  S.vista = vista;
  const hash = vista + (arg || param ? '/' + (arg || param) : '');
  if (location.hash !== '#' + hash) history.replaceState(null, '', '#' + hash);
  $$('.lateral a').forEach((a) => a.classList.toggle('activo', a.dataset.ir === (vista === 'editar' ? 'buscar' : vista)));
  cerrarMenu();
  window.scrollTo(0, 0);
  $('#vista').innerHTML = '<div class="cargando"><div class="spinner-border spinner-border-sm me-2"></div>Cargando…</div>';
  try { await VISTAS[vista](arg || param); } catch (e) { $('#vista').innerHTML = `<div class="alert alert-danger">${esc(e.message)}</div>`; }
}

document.addEventListener('click', (ev) => {
  const a = ev.target.closest('[data-ir]');
  if (!a) return;
  ev.preventDefault();
  ir(a.dataset.ir);
});

function cerrarMenu() { $('#lateral').classList.remove('abierto'); $('#velo').classList.remove('visible'); }
$('#btn-menu').addEventListener('click', () => { $('#lateral').classList.toggle('abierto'); $('#velo').classList.toggle('visible'); });
$('#velo').addEventListener('click', cerrarMenu);
window.addEventListener('beforeunload', (ev) => { if (S.sucio) { ev.preventDefault(); ev.returnValue = ''; } });

function cabecera(titulo, texto, acciones = '') {
  return `<div class="cabecera-vista"><div><h1>${titulo}</h1>${texto ? `<p>${texto}</p>` : ''}</div><div class="d-flex flex-wrap gap-2 no-imprimir">${acciones}</div></div>`;
}

/* ---------- Inicio ---------- */

async function vistaInicio() {
  const r = await api('inicio');
  const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
  const carpetasMias = r.carpetas.mias.length
    ? r.carpetas.mias.map((n) => `<a href="#" class="etiqueta e-EN-CURSO text-decoration-none" data-ir="carpetas">Carpeta ${esc(n)}</a>`).join(' ')
    : '<span class="text-suave">Ninguna. Ve a <a href="#" data-ir="carpetas">Carpetas</a> y asígnate una antes de empezar.</span>';
  const profes = Object.entries(r.porProfesor).sort((a, b) => b[1] - a[1]);
  const maxP = profes.length ? profes[0][1] : 1;
  const ep = epocaActual();
  $('#vista').innerHTML = cabecera(`${esc(ep.NOMBRE || 'Resumen')} <small class="fs-6 text-suave fw-normal">${esc(anosEpoca(ep))}</small>`,
    `Hola, ${esc((S.usuario.nombre || '').split(' ')[0] || '')}. Estado del vaciado de esta época.${ep.ESTADO === 'CERRADA' ? ' <span class="etiqueta">Época cerrada</span>' : ''}`,
    puede('EDITOR') ? '<button class="btn btn-primary" data-ir="nuevo"><i class="bi bi-plus-lg me-1"></i> Nuevo expediente</button>' : '') + `
    <div class="row g-3 mb-3">
      <div class="col-6 col-xl-3"><div class="kpi"><div class="etq">Expedientes registrados</div><div class="num">${numero(r.total)}</div><div class="sub">${numero(r.hoy)} hoy · ${numero(r.mios)} tuyos</div></div></div>
      <div class="col-6 col-xl-3"><div class="kpi"><div class="etq">Terminados</div><div class="num">${numero(r.terminados)}</div>
        <div class="barra-prog mt-2"><div style="width:${pct(r.terminados, r.total)}%"></div></div><div class="sub mt-1">${pct(r.terminados, r.total)} % del total</div></div></div>
      <div class="col-6 col-xl-3"><div class="kpi"><div class="etq">Carpetas terminadas</div><div class="num">${numero(r.carpetas.terminadas)} <small class="fs-6 text-suave">/ ${numero(r.carpetas.total)}</small></div>
        <div class="barra-prog mt-2"><div style="width:${pct(r.carpetas.terminadas, r.carpetas.total)}%"></div></div><div class="sub mt-1">${numero(r.carpetas.enCurso)} en curso</div></div></div>
      <div class="col-6 col-xl-3"><div class="kpi"><div class="etq">Digitalizados · Ilustres</div><div class="num">${numero(r.digitalizados)} <small class="fs-6 text-suave">· ${numero(r.ilustres)}</small></div><div class="sub">expedientes marcados «SÍ»</div></div></div>
    </div>
    <div class="row g-3">
      <div class="col-lg-7">
        <div class="panel h-100"><div class="panel-cab"><h2>Últimos movimientos</h2>${puede('ADMIN') ? '<a href="#" data-ir="historial" class="small">Ver todo</a>' : ''}</div>
          ${r.ultimos.length ? `<div class="table-responsive"><table class="table tabla"><tbody>${r.ultimos.map((m) => `
            <tr${m.ID ? ` class="clic" data-ficha="${esc(m.ID)}"` : ''}><td class="text-nowrap small text-suave">${esc(m.FECHA.slice(0, 16))}</td>
            <td class="small"><strong>${esc(m.USUARIO)}</strong> · ${esc(m.ACCION.toLowerCase())} <div class="text-suave text-truncate" style="max-width:420px">${esc(m.DETALLE)}</div></td></tr>`).join('')}
          </tbody></table></div>` : '<div class="vacio"><i class="bi bi-inbox"></i>Todavía no hay movimientos.</div>'}
        </div>
      </div>
      <div class="col-lg-5 d-flex flex-column gap-3">
        <div class="panel"><div class="panel-cab"><h2>Tus carpetas en curso</h2></div><div class="panel-cuerpo">${carpetasMias}</div></div>
        <div class="panel"><div class="panel-cab"><h2>Expedientes por profesor/a</h2></div><div class="panel-cuerpo">
          ${profes.length ? profes.slice(0, 12).map(([p, n]) => `<div class="mb-2"><div class="d-flex justify-content-between small"><span>${esc(p)}</span><strong>${numero(n)}</strong></div>
            <div class="barra-prog"><div style="width:${pct(n, maxP)}%;background:var(--tinta)"></div></div></div>`).join('') : '<span class="text-suave small">Sin datos todavía.</span>'}
        </div></div>
      </div>
    </div>`;
  $$('[data-ficha]').forEach((tr) => tr.addEventListener('click', () => verFicha(tr.dataset.ficha)));
}

/* ---------- Formulario de expediente ---------- */

function opcionesHtml(lista, valor, vacio) {
  let h = vacio !== undefined ? `<option value="">${esc(vacio)}</option>` : '';
  const vals = lista.map((o) => (typeof o === 'string' ? { v: o, t: o } : o));
  if (valor && !vals.some((o) => o.v === valor)) vals.unshift({ v: valor, t: valor + ' (valor antiguo)' });
  return h + vals.map((o) => `<option value="${esc(o.v)}"${o.v === valor ? ' selected' : ''}>${esc(o.t)}</option>`).join('');
}

function controlCampo(c, valor) {
  const id = 'f_' + c.clave;
  const req = c.obligatorio ? ' required' : '';
  const base = `id="${id}" name="${esc(c.clave)}" data-campo="${esc(c.clave)}"${req}`;
  const v = valor == null ? '' : String(valor);
  switch (c.tipo) {
    case 'texto_largo':
      return `<textarea class="form-control" rows="3" ${base}>${esc(v)}</textarea>`;
    case 'numero':
      return `<input type="text" inputmode="numeric" class="form-control" pattern="-?[0-9]+([.,][0-9]+)?" ${base} value="${esc(v)}">`;
    case 'fecha':
      return `<input type="text" class="form-control" placeholder="dd/mm/aaaa" pattern="(\\d{1,2}/)?(\\d{1,2}/)?\\d{4}" ${base} value="${esc(v)}">`;
    case 'seleccion':
      return `<select class="form-select" ${base}>${opcionesHtml(c.opciones, v, c.obligatorio ? undefined : '—')}</select>`;
    case 'si_no':
      return `<select class="form-select" ${base}>${opcionesHtml(['SÍ', 'NO'], v, c.obligatorio ? undefined : '—')}</select>`;
    case 'profesor':
      return `<select class="form-select" ${base}>${opcionesHtml(S.profesores.filter((p) => p.ACTIVO !== 'NO').map((p) => p.NOMBRE), v, '— Elegir —')}</select>`;
    case 'carpeta':
      return `<select class="form-select" ${base}>${opcionesHtml(S.carpetas.map((x) => ({ v: x.NUMERO, t: textoCarpeta(x.NUMERO) })), v, '— Elegir carpeta —')}</select>`;
    case 'pais':
      return `<select class="form-select" ${base} data-geo="pais">${opcionesHtml(GEO.paises, v || S.ajustes.PAIS_DEFECTO || 'España', c.obligatorio ? undefined : '—')}</select>`;
    case 'provincia':
      return `<div data-geo="provincia-caja">${controlProvincia(c, v)}</div>`;
    case 'localidad':
      return `<input type="text" class="form-control" list="dl-localidades" autocomplete="off" ${base} value="${esc(v)}" placeholder="Escríbela a mano">`;
    default:
      return `<input type="text" class="form-control" ${base} value="${esc(v)}"${c.clave === 'APELLIDOS' ? ' data-mayus autocomplete="off"' : c.clave === 'NOMBRE' ? ' autocomplete="off"' : ''}>`;
  }
}

function controlProvincia(c, v, pais) {
  pais = pais || ($('[data-geo="pais"]') || {}).value || S.ajustes.PAIS_DEFECTO || 'España';
  const base = `id="f_${c.clave}" name="${esc(c.clave)}" data-campo="${esc(c.clave)}" data-geo="provincia"${c.obligatorio ? ' required' : ''}`;
  if (pais === 'España') return `<select class="form-select" ${base}>${opcionesHtml(GEO.provincias, v, '— Elegir provincia —')}</select>`;
  // Fuera de España no hay lista de provincias: el campo queda vacío y oculto.
  return `<input type="hidden" ${base.replace(' required', '')} value=""><div class="form-control bg-light text-suave">No aplica (fuera de España)</div>`;
}

/** Actualiza provincia y sugerencias de localidad al cambiar el país o la provincia. */
async function actualizarGeo(cambioPais) {
  const pais = ($('[data-geo="pais"]') || {}).value || 'España';
  const cProv = S.campos.find((c) => c.tipo === 'provincia' && c.activo);
  if (cambioPais && cProv) {
    const caja = $('[data-geo="provincia-caja"]');
    if (caja) {
      caja.innerHTML = controlProvincia(cProv, pais === 'España' ? S.ajustes.PROVINCIA_DEFECTO || '' : '', pais);
      const sel = $('[data-geo="provincia"]', caja);
      sel.addEventListener('change', () => actualizarGeo(false));
    }
  }
  const prov = ($('[data-geo="provincia"]') || {}).value || '';
  const loc = $('#f_LOCALIDAD');
  if (loc) loc.placeholder = pais === 'España' ? (prov ? `Localidad de ${prov} (escríbela)` : 'Escríbela a mano') : `Ciudad o localidad de ${pais}`;
  // Sugerencias: municipios actuales (INE) + localidades ya registradas por el equipo. Siempre se puede escribir otra.
  const clave = pais === 'España' ? 'ES|' + prov : pais;
  let usadas = S.localidades[clave];
  const pintar = () => {
    const municipios = pais === 'España' && prov && GEO.municipios[prov] ? GEO.municipios[prov] : [];
    const todas = Array.from(new Set((usadas || []).concat(municipios))).sort((a, b) => a.localeCompare(b, 'es'));
    $('#dl-localidades').innerHTML = todas.map((l) => `<option value="${esc(l)}">`).join('');
  };
  pintar();
  if (!usadas && (prov || pais !== 'España')) {
    try {
      usadas = await api('localidadesUsadas', pais === 'España' ? { provincia: prov } : { pais });
      S.localidades[clave] = usadas;
      pintar();
    } catch (e) { /* sólo sugerencias */ }
  }
}

async function vistaFormulario(id) {
  if (!puede('EDITOR')) { $('#vista').innerHTML = '<div class="alert alert-warning">Tu perfil es de sólo consulta.</div>'; return; }
  let reg = null, bloqueo = null;
  if (id && epocaDeUid(id) && epocaDeUid(id) !== S.epoca) await cambiarEpoca(epocaDeUid(id), false);
  if (epocaActual().ESTADO === 'CERRADA' && !puede('ADMIN')) {
    $('#vista').innerHTML = `<div class="alert alert-warning">La época «${esc(epocaActual().NOMBRE)}» está cerrada: sólo la coordinación puede añadir o modificar expedientes.</div>`;
    return;
  }
  if (id) {
    const r = await api('obtener', { id });
    if (!r.puedeEditar) { aviso('No puedes modificar este expediente.', 'aviso'); verFicha(id); ir('buscar'); return; }
    reg = r.registro;
    bloqueo = r.bloqueo;
    const b = await api('bloquear', { id });
    bloqueo = b.bloqueo || bloqueo;
    S.edicion = { id, version: reg._VERSION, registro: reg };
    S.latido = setInterval(() => api('bloquear', { id }).catch(() => {}), 4 * 60 * 1000);
  } else {
    S.edicion = null;
  }
  const campos = camposActivos();
  const valorInicial = (c) => {
    if (reg) return reg[c.clave];
    if (S.pegajosos[c.clave] !== undefined) return S.pegajosos[c.clave];
    if (c.tipo === 'profesor') return S.usuario.nombre;
    if (c.tipo === 'provincia') return S.ajustes.PROVINCIA_DEFECTO || '';
    if ((c.tipo === 'seleccion' || c.tipo === 'si_no') && c.obligatorio) return (c.opciones || [])[0] || 'NO';
    return '';
  };
  const secciones = [];
  campos.forEach((c) => {
    let s = secciones.find((x) => x.nombre === c.seccion);
    if (!s) secciones.push((s = { nombre: c.seccion, campos: [] }));
    s.campos.push(c);
  });
  const ancho = (c) => (c.tipo === 'texto_largo' ? 'col-12' : ['pais', 'provincia', 'localidad'].includes(c.tipo) ? 'col-md-4' : 'col-md-6');

  $('#vista').innerHTML = cabecera((reg ? 'Modificar expediente' : 'Nuevo expediente') + ` <span class="etiqueta e-EPOCA align-middle">${esc(epocaActual().NOMBRE || '')}</span>`,
    reg ? `<span class="id-exp">${esc(reg.ID || 'En papelera')}</span> · creado por ${esc(reg._CREADO_POR)} el ${esc(reg._CREADO_EN)}` : 'Antes de guardar, la aplicación comprueba si el alumno ya está registrado.',
    reg ? `<button class="btn btn-light" id="btn-ver-ficha"><i class="bi bi-eye me-1"></i> Ver ficha</button>` : '') + `
    ${bloqueo ? `<div class="aviso-edicion"><i class="bi bi-person-lock me-2"></i><strong>${esc(bloqueo.nombre || bloqueo.email)}</strong> tiene abierto este expediente para editarlo desde las ${esc(String(bloqueo.desde).slice(11, 16))}. Si guardáis los dos, sólo se aceptará el primero.</div>` : ''}
    <div class="row g-4">
      <div class="col-xl-8">
        <form id="form-exp" novalidate autocomplete="off">
          ${secciones.map((s) => `<div class="panel seccion-form"><div class="panel-cab"><h2>${esc(s.nombre)}</h2></div><div class="panel-cuerpo"><div class="row g-3">
            ${s.campos.map((c) => `<div class="${ancho(c)}"><label class="form-label" for="f_${esc(c.clave)}">${esc(c.etiqueta)}${c.obligatorio ? ' <span class="req">*</span>' : ''}</label>
              ${controlCampo(c, valorInicial(c))}${c.ayuda ? `<div class="form-text">${esc(c.ayuda)}</div>` : ''}<div class="invalid-feedback">Revisa este dato.</div></div>`).join('')}
          </div></div></div>`).join('')}
          <datalist id="dl-localidades"></datalist>
          <div class="barra-acciones">
            <button type="button" class="btn btn-light me-auto" id="btn-cancelar">${reg ? 'Cancelar' : 'Vaciar formulario'}</button>
            ${reg ? '' : '<button type="submit" class="btn btn-outline-primary" data-despues="ficha"><i class="bi bi-check2 me-1"></i> Guardar</button>'}
            <button type="submit" class="btn btn-primary" data-despues="${reg ? 'ficha' : 'nuevo'}"><i class="bi bi-save me-1"></i> ${reg ? 'Guardar cambios' : 'Guardar y siguiente'}</button>
          </div>
        </form>
      </div>
      <div class="col-xl-4">
        <div class="lateral-form d-flex flex-column gap-3">
          <div class="panel"><div class="panel-cab"><h2><i class="bi bi-shield-check me-1"></i> Comprobación de duplicados</h2></div>
            <div class="panel-cuerpo" id="panel-dup"><div class="estado-dup neutro">Escribe los apellidos y el nombre para comprobar si el alumno ya está registrado.</div></div></div>
          <div class="panel"><div class="panel-cab"><h2><i class="bi bi-folder2 me-1"></i> Carpeta</h2></div>
            <div class="panel-cuerpo small" id="panel-carpeta"><span class="text-suave">Según los apellidos, la aplicación te dirá en qué carpeta debería estar.</span></div></div>
        </div>
      </div>
    </div>`;

  const form = $('#form-exp');
  S.sucio = false;
  form.addEventListener('input', () => { S.sucio = true; });
  form.addEventListener('change', () => { S.sucio = true; });
  const selPais = $('[data-geo="pais"]', form);
  if (selPais) selPais.addEventListener('change', () => actualizarGeo(true));
  const selProv = $('[data-geo="provincia"]', form);
  if (selProv) selProv.addEventListener('change', () => actualizarGeo(false));
  actualizarGeo(false);

  const ap = $('#f_APELLIDOS'), no = $('#f_NOMBRE'), ca = $('#f_CARPETA');
  const comprobar = debounce(comprobarDuplicadosForm, 600);
  [ap, no].forEach((el) => el && el.addEventListener('input', comprobar));
  if (ap) ap.addEventListener('input', revisarCarpeta);
  if (ca) ca.addEventListener('change', revisarCarpeta);
  if (reg) { comprobarDuplicadosForm(); revisarCarpeta(); }
  $('#btn-ver-ficha') && $('#btn-ver-ficha').addEventListener('click', () => verFicha(reg._UID));
  $('#btn-cancelar').addEventListener('click', async () => {
    if (S.sucio && !(await confirmar('Descartar cambios', '<p>Se perderá lo que has escrito.</p>', 'Descartar', true))) return;
    S.sucio = false;
    if (reg) ir('buscar'); else { S.pegajosos = {}; ir('nuevo'); }
  });
  form.addEventListener('submit', (ev) => { ev.preventDefault(); guardarExpediente(ev.submitter); });
  (reg ? null : ($('#f_CARPETA') && $('#f_CARPETA').value ? ap : $('#f_CARPETA')) || ap)?.focus();
}

function salirDeEdicion() {
  if (S.latido) { clearInterval(S.latido); S.latido = null; }
  if (S.edicion) { api('liberar', { id: S.edicion.id }).catch(() => {}); S.edicion = null; }
  S.sucio = false;
}

async function comprobarDuplicadosForm() {
  const ap = ($('#f_APELLIDOS') || {}).value || '', no = ($('#f_NOMBRE') || {}).value || '';
  const panel = $('#panel-dup');
  if (!panel) return;
  if (ap.trim().length < 2) { panel.innerHTML = '<div class="estado-dup neutro">Escribe los apellidos y el nombre para comprobar si el alumno ya está registrado.</div>'; return; }
  panel.innerHTML = '<div class="estado-dup neutro"><span class="spinner-border spinner-border-sm me-2"></span>Comprobando…</div>';
  try {
    const r = await api('comprobarDuplicados', { apellidos: ap, nombre: no, id: S.edicion && S.edicion.id });
    if (($('#f_APELLIDOS') || {}).value !== ap || ($('#f_NOMBRE') || {}).value !== no) return; // ya ha cambiado
    const fila = (x) => `<div class="coincidencia"><div><strong>${esc(x.APELLIDOS)}</strong>, ${esc(x.NOMBRE)}
      <div class="text-suave small">${[x.CARPETA && 'Carpeta ' + x.CARPETA, x.CURSO, x.LOCALIDAD, x.PROFESOR].filter(Boolean).map(esc).join(' · ')}</div></div>
      <button type="button" class="btn btn-sm btn-light align-self-start" data-ficha="${esc(x._UID)}">Ver</button></div>`;
    let h = '';
    if (r.exactos.length) h += `<div class="estado-dup mal mb-2"><i class="bi bi-exclamation-octagon-fill me-1"></i><strong>Este alumno ya está registrado.</strong> Revísalo antes de crear otro expediente.</div>${r.exactos.map(fila).join('')}`;
    if (r.parecidos.length) h += `<div class="estado-dup aviso my-2"><i class="bi bi-exclamation-triangle-fill me-1"></i><strong>Nombre muy parecido</strong> (grafía antigua: X/J, V/B, Y/I…). ¿Es la misma persona?</div>${r.parecidos.map(fila).join('')}`;
    if (!r.exactos.length && !r.parecidos.length && no.trim()) h += `<div class="estado-dup ok"><i class="bi bi-check-circle-fill me-1"></i>No hay ningún expediente con este nombre${S.epocas.length > 1 ? ' en esta época' : ''}.</div>`;
    if ((r.otrasEpocas || []).length) h += `<div class="estado-dup aviso my-2"><i class="bi bi-hourglass-split me-1"></i><strong>También aparece en otra época.</strong> Puede ser el mismo alumno si estudió en varios periodos.</div>${r.otrasEpocas.map((x) => fila(x).replace('<div class="text-suave small">', `<div class="text-suave small"><span class="etiqueta e-EPOCA">${esc(x.EPOCA)}</span> `)).join('')}`;
    if (r.mismosApellidos.length) h += `<div class="small text-suave mt-3 mb-1">Otros alumnos con los mismos apellidos (${r.totalMismos}):</div>${r.mismosApellidos.slice(0, 8).map(fila).join('')}`;
    panel.innerHTML = h || '<div class="estado-dup neutro">Escribe también el nombre.</div>';
    $$('[data-ficha]', panel).forEach((b) => b.addEventListener('click', () => verFicha(b.dataset.ficha)));
  } catch (e) {
    panel.innerHTML = `<div class="estado-dup aviso">${esc(e.message)}</div>`;
  }
}

function revisarCarpeta() {
  const panel = $('#panel-carpeta');
  if (!panel) return;
  const ap = ($('#f_APELLIDOS') || {}).value || '';
  const sel = $('#f_CARPETA');
  const actual = sel ? sel.value : '';
  const sug = carpetaSugerida(ap);
  let h = '';
  if (actual) {
    const c = S.carpetas.find((x) => x.NUMERO === actual);
    h += `<div class="mb-2">Seleccionada: <strong>Carpeta ${esc(actual)}</strong>${c && (c.DESDE || c.HASTA) ? `<div class="text-suave">De ${esc(c.DESDE || '…')} a ${esc(c.HASTA || '…')}</div>` : '<div class="text-suave">Esta carpeta aún no tiene definido su rango de apellidos.</div>'}</div>`;
  }
  if (ap.trim().length >= 2) {
    if (sug && sug.NUMERO !== actual) {
      h += `<div class="estado-dup aviso"><i class="bi bi-lightbulb me-1"></i>Por los apellidos, debería estar en la <strong>carpeta ${esc(sug.NUMERO)}</strong> (${esc(sug.DESDE)} – ${esc(sug.HASTA)}).
        <button type="button" class="btn btn-sm btn-outline-primary mt-2 d-block" id="usar-carpeta">Usar la carpeta ${esc(sug.NUMERO)}</button></div>`;
    } else if (sug) {
      h += '<div class="estado-dup ok"><i class="bi bi-check-circle-fill me-1"></i>Los apellidos encajan con el rango de esta carpeta.</div>';
    } else {
      h += '<div class="text-suave">Ninguna carpeta con rango definido incluye estos apellidos.</div>';
    }
  }
  panel.innerHTML = h || '<span class="text-suave">Según los apellidos, la aplicación te dirá en qué carpeta debería estar.</span>';
  $('#usar-carpeta') && $('#usar-carpeta').addEventListener('click', () => { sel.value = sug.NUMERO; S.sucio = true; revisarCarpeta(); });
}

function recogerFormulario() {
  const datos = {};
  $$('[data-campo]', $('#form-exp')).forEach((el) => { datos[el.dataset.campo] = el.value; });
  if (datos.APELLIDOS) datos.APELLIDOS = datos.APELLIDOS.toUpperCase();
  return datos;
}

async function guardarExpediente(boton) {
  const form = $('#form-exp');
  form.classList.add('was-validated');
  if (!form.checkValidity()) {
    const mal = $(':invalid', form);
    if (mal) { mal.focus(); mal.scrollIntoView({ block: 'center' }); }
    aviso('Faltan datos obligatorios o hay alguno incorrecto.', 'aviso');
    return;
  }
  const despues = boton && boton.dataset.despues;
  const registro = recogerFormulario();
  const peticion = { registro, id: S.edicion && S.edicion.id, version: S.edicion && S.edicion.version };
  const botones = $$('button[type=submit]', form);
  botones.forEach((b) => (b.disabled = true));
  ocupado(boton, true);
  try {
    let r = await api('guardar', peticion);
    if (r.duplicado) {
      const lista = r.coincidencias.map((x) => `<li><strong>${esc(x.APELLIDOS)}</strong>, ${esc(x.NOMBRE)} <span class="id-exp">${esc(x.ID)}</span>
        <div class="small text-suave">${[x.CARPETA && 'Carpeta ' + x.CARPETA, x.CURSO && 'Curso ' + x.CURSO, x.LOCALIDAD, x.PROFESOR].filter(Boolean).map(esc).join(' · ')}</div></li>`).join('');
      const ok = await confirmar('Posible expediente duplicado',
        `<p>Ya hay ${r.coincidencias.length === 1 ? 'un expediente' : 'expedientes'} con este nombre:</p><ul class="mb-3">${lista}</ul>
         <p class="small">Guarda sólo si estás seguro/a de que es <strong>otra persona</strong> (un homónimo). Quedará anotado en el historial.</p>
         <div class="form-check"><input class="form-check-input" type="checkbox" id="chk-homonimo" data-requerido>
         <label class="form-check-label" for="chk-homonimo">He comprobado que es otra persona</label></div>`,
        'Guardar igualmente', true);
      if (!ok) return;
      peticion.confirmarHomonimo = true;
      r = await api('guardar', peticion);
    }
    S.sucio = false;
    if (S.latido) { clearInterval(S.latido); S.latido = null; }
    S.edicion = null;
    aviso(r.creado ? `Expediente ${r.numero} guardado (nº de orden alfabético).` : `Cambios guardados en ${r.numero}.`);
    if (r.creado) {
      // Se conservan profesor/a y carpeta para agilizar el vaciado de la misma carpeta.
      S.pegajosos = {};
      camposActivos().filter((c) => ['profesor', 'carpeta'].includes(c.tipo)).forEach((c) => { S.pegajosos[c.clave] = registro[c.clave]; });
    }
    if (despues === 'nuevo') { await ir('nuevo'); $('#f_APELLIDOS') && $('#f_APELLIDOS').focus(); }
    else { await ir('buscar'); verFicha(r.id); }
  } catch (e) {
    if (/^CONFLICTO/.test(e.message)) {
      const ok = await confirmar('Otra persona ha cambiado este expediente', `<p>${esc(e.message.replace(/^CONFLICTO:\s*/, ''))}</p><p class="small text-suave">Copia lo que necesites antes de recargar.</p>`, 'Recargar el expediente');
      if (ok) { S.sucio = false; const id = S.edicion.id; ir('editar', id); }
    } else error(e);
  } finally {
    ocupado(boton, false);
    botones.forEach((b) => (b.disabled = false));
  }
}

/* ---------- Ficha de un expediente ---------- */

async function verFicha(id) {
  abrirModal('Expediente', '<div class="cargando"><div class="spinner-border spinner-border-sm"></div></div>', null);
  try {
    const r = await api('obtener', { id });
    const reg = r.registro;
    const borrado = reg._BORRADO === 'SÍ';
    const secciones = [];
    camposActivos().forEach((c) => {
      let s = secciones.find((x) => x.nombre === c.seccion);
      if (!s) secciones.push((s = { nombre: c.seccion, campos: [] }));
      s.campos.push(c);
    });
    const valor = (c) => {
      const v = reg[c.clave];
      if (!v) return '<span class="text-suave">—</span>';
      if (c.tipo === 'carpeta') return esc(textoCarpeta(v));
      if (c.clave === 'ESTADO') return etiquetaEstado(v);
      return esc(v);
    };
    const cuerpo = `
      ${borrado ? '<div class="alert alert-danger py-2"><i class="bi bi-trash me-1"></i>Este expediente está en la papelera.</div>' : ''}
      ${r.bloqueo ? `<div class="aviso-edicion small"><i class="bi bi-person-lock me-1"></i>${esc(r.bloqueo.nombre || r.bloqueo.email)} lo está editando ahora mismo.</div>` : ''}
      <div class="ficha">${secciones.map((s) => `<h3>${esc(s.nombre)}</h3><dl class="row mb-0">${s.campos.map((c) =>
        `<div class="${c.tipo === 'texto_largo' ? 'col-12' : 'col-sm-6'}"><dt>${esc(c.etiqueta)}</dt><dd>${valor(c)}</dd></div>`).join('')}</dl>`).join('')}
      <h3>Control del registro</h3>
      <dl class="row mb-0 small">
        <div class="col-sm-6"><dt>Época</dt><dd><span class="etiqueta e-EPOCA">${esc(epocaPorCodigo(epocaDeUid(reg._UID)).NOMBRE || epocaActual().NOMBRE || '')}</span></dd></div>
        <div class="col-sm-6"><dt>Nº de orden alfabético</dt><dd class="id-exp">${esc(reg.ID || '—')}</dd></div>
        <div class="col-sm-6"><dt>Nº de registro (permanente) · versión</dt><dd><span class="id-exp">${esc(reg._UID)}</span> · v${esc(reg._VERSION)}</dd></div>
        <div class="col-sm-6"><dt>Creado</dt><dd>${esc(reg._CREADO_EN)}<br><span class="text-suave">${esc(reg._CREADO_POR)}</span></dd></div>
        <div class="col-sm-6"><dt>Última modificación</dt><dd>${esc(reg._MODIFICADO_EN)}<br><span class="text-suave">${esc(reg._MODIFICADO_POR)}</span></dd></div>
      </dl>
      <div id="ficha-historial"><button class="btn btn-sm btn-link px-0" id="btn-hist-ficha"><i class="bi bi-clock-history me-1"></i>Ver historial de cambios de este expediente</button></div></div>`;
    const pie = `
      ${puede('ADMIN') ? (borrado ? '<button class="btn btn-outline-success me-auto" id="btn-restaurar"><i class="bi bi-arrow-counterclockwise me-1"></i>Restaurar</button>'
        : '<button class="btn btn-outline-danger me-auto" id="btn-borrar"><i class="bi bi-trash me-1"></i>Enviar a la papelera</button>') : ''}
      <button class="btn btn-light" data-bs-dismiss="modal">Cerrar</button>
      ${r.puedeEditar ? '<button class="btn btn-primary" id="btn-editar"><i class="bi bi-pencil me-1"></i>Modificar</button>' : ''}`;
    abrirModal(`<span class="ap">${esc(reg.APELLIDOS)}</span>, ${esc(reg.NOMBRE)} <span class="id-exp ms-2">${esc(reg.ID)}</span>`, cuerpo, pie);
    $('#btn-editar') && $('#btn-editar').addEventListener('click', () => { cerrarModal(); ir('editar', id); });
    $('#btn-hist-ficha').addEventListener('click', async () => {

/* ---------- Tablas de resultados ---------- */

const GEO_CLAVES = ['LOCALIDAD', 'PROVINCIA', 'PAIS'];
const CABECERAS_CORTAS = { PROFESOR: 'Profesor/a', ESTADO: 'Estado', CARPETA: 'Carpeta', CURSO: 'Curso', ILUSTRE: 'Ilustre', DIGITALIZADO: 'Digitalizado', LUGAR: 'Lugar de nacimiento' };
const ORDEN_COLUMNAS = ['LUGAR', 'CURSO', 'CARPETA', 'ILUSTRE', 'DIGITALIZADO', 'ESTADO', 'PROFESOR'];

function etiquetaSiNo(v) {
  const t = sinAcentos(v);
  if (t === 'SI') return '<span class="etiqueta e-SI"><i class="bi bi-check-lg"></i> Sí</span>';
  if (t === 'NO') return '<span class="etiqueta e-NO">No</span>';
  if (t === 'HAY QUE BUSCAR') return '<span class="etiqueta e-EN-PROCESO">Hay que buscar</span>';
  return esc(v);
}

function lugar(f) {
  const partes = [];
  if (f.LOCALIDAD) partes.push(`<strong class="fw-semibold">${esc(f.LOCALIDAD)}</strong>`);
  if (f.PROVINCIA) partes.push(f.LOCALIDAD ? `<span class="text-suave">(${esc(f.PROVINCIA)})</span>` : esc(f.PROVINCIA));
  if (f.PAIS && f.PAIS !== 'España') partes.push(`<span class="etiqueta e-EXTRANJERO"><i class="bi bi-globe2"></i> ${esc(f.PAIS)}</span>`);
  return partes.join(' ') || '<span class="text-suave">—</span>';
}

function celda(k, v, f) {
  if (k === 'LUGAR') return lugar(f);
  if (k === 'ESTADO') return etiquetaEstado(v);
  if (k === 'CARPETA') return v ? `<span class="etiqueta">${esc(v)}</span>` : '';
  if (k === 'ILUSTRE' && sinAcentos(v) === 'SI') return '<span class="etiqueta e-ILUSTRE"><i class="bi bi-star-fill"></i> Sí</span>';
  const c = campoPorClave(k);
  if (c && ['seleccion', 'si_no'].includes(c.tipo) && /^(SÍ|SI|NO|HAY QUE BUSCAR)$/i.test(v || '')) return etiquetaSiNo(v);
  return esc(v);
}

/** Columnas de los listados: país, provincia y localidad se juntan en «Lugar de nacimiento». */
function columnasVisibles(cols) {
  const out = [];
  cols.forEach((k) => {
    const x = GEO_CLAVES.includes(k) ? 'LUGAR' : k;
    if (!out.includes(x)) out.push(x);
  });
  const pos = (k) => (ORDEN_COLUMNAS.indexOf(k) < 0 ? 99 : ORDEN_COLUMNAS.indexOf(k));
  return out.sort((a, b) => pos(a) - pos(b));
}

function tablaResultados(r) {
  if (!r.filas.length) return '<div class="vacio"><i class="bi bi-search"></i>No hay expedientes que coincidan.</div>';
  const cols = columnasVisibles(r.columnas);
  const conEpoca = !!r.todas;
  return `<div class="table-responsive"><table class="table tabla table-hover">
    <thead><tr>${conEpoca ? '<th>Época</th>' : ''}<th>Nº</th><th>Apellidos</th><th>Nombre</th>${cols.map((k) => `<th>${esc(CABECERAS_CORTAS[k] || etiquetaDe(k))}</th>`).join('')}</tr></thead>
    <tbody>${r.filas.map((f) => `<tr class="clic" data-ficha="${esc(f._UID)}">${conEpoca ? `<td><span class="etiqueta e-EPOCA">${esc(f.EPOCA)}</span></td>` : ''}<td class="id-exp text-nowrap">${esc(f.ID || '—')}</td>
      <td class="ap">${esc(f.APELLIDOS)}</td><td>${esc(f.NOMBRE)}</td>
      ${cols.map((k) => `<td>${celda(k, f[k], f)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

function enlazarFichas(el) {
  $$('[data-ficha]', el).forEach((tr) => tr.addEventListener('click', () => verFicha(tr.dataset.ficha)));
}

/* ---------- Buscar ---------- */

function camposFiltro() {
  return camposActivos().filter((c) => ['seleccion', 'si_no', 'profesor', 'carpeta', 'provincia', 'pais'].includes(c.tipo));
}

function opcionesFiltro(c) {
  if (c.tipo === 'profesor') return S.profesores.map((p) => p.NOMBRE);
  if (c.tipo === 'carpeta') return S.carpetas.map((x) => ({ v: x.NUMERO, t: 'Carpeta ' + x.NUMERO }));
  if (c.tipo === 'provincia') return GEO.provincias;
  if (c.tipo === 'pais') return GEO.paises;
  if (c.tipo === 'si_no') return ['SÍ', 'NO'];
  return c.opciones;
}

  $('#limpiar').addEventListener('click', () => { S.busqueda = { q: '', filtros: {}, orden: 'apellidos', pagina: 1, papelera: false, soloMios: false, todas: false }; vistaBuscar(); });
  $('#btn-exportar') && $('#btn-exportar').addEventListener('click', exportarCsv);

let numBusqueda = 0;
async function buscar() {
  const B = S.busqueda;
  const n = ++numBusqueda;
  const cont = $('#resultados');
  if (!cont) return;
  cont.style.opacity = '.55';
  try {
    const r = await api('consultar', { q: B.q, filtros: B.filtros, orden: B.orden, pagina: B.pagina, tam: 50, papelera: B.papelera, soloMios: B.soloMios, todas: B.todas && S.epocas.length > 1 });
    if (n !== numBusqueda || !$('#resultados')) return;
    cont.innerHTML = tablaResultados(r) + paginacion(r.pagina, r.paginas, r.total, (p) => { B.pagina = p; buscar(); window.scrollTo(0, 0); });
    enlazarFichas(cont);
  } catch (e) {
    cont.innerHTML = `<div class="alert alert-danger m-3">${esc(e.message)}</div>`;
  } finally { cont.style.opacity = ''; }
}

async function exportarCsv() {
  const b = $('#btn-exportar');
  ocupado(b, true, 'Preparando…');
  try {
    const B = S.busqueda;
    const r = await api('exportar', { q: B.q, filtros: B.filtros, orden: B.orden, papelera: B.papelera, soloMios: B.soloMios });
    const blob = new Blob([r.csv], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `expedientes-ies-goya-${new Date().toISOString().slice(0, 10)}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    aviso(`Exportados ${numero(r.total)} expedientes.`);
  } catch (e) { error(e); } finally { ocupado(b, false); }
}

function generarCodigo() {
  const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const a = new Uint32Array(8);
  crypto.getRandomValues(a);
  return Array.from(a, (n) => c[n % c.length]).join('');
}

          ${S.urlApp ? `<div class="mb-2"><div class="text-suave">Enlace para el profesorado</div><div class="input-group input-group-sm"><input class="form-control" readonly value="${esc(S.urlApp)}" id="url-app"><button class="btn btn-outline-secondary" id="copiar-url">Copiar</button></div></div>` : ''}
          ${S.urlHoja ? `<a href="${esc(S.urlHoja)}" target="_blank" rel="noopener"><i class="bi bi-table me-1"></i>Abrir la hoja de cálculo</a>
            <div class="text-suave mt-1">No compartas la hoja con permiso de edición: el profesorado debe trabajar sólo desde la aplicación.</div>` : ''}
        </div></div>
      </div>
    </div>`;
  $('#form-ajustes').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const f = ev.target;
    const datos = { NOMBRE_APP: f.NOMBRE_APP.value, SUBTITULO: f.SUBTITULO.value, PAIS_DEFECTO: f.PAIS_DEFECTO.value,
      PROVINCIA_DEFECTO: f.PROVINCIA_DEFECTO.value, EDITORES_SOLO_PROPIOS: f.EDITORES_SOLO_PROPIOS.checked ? 'SÍ' : 'NO', LECTURA_ABIERTA: f.LECTURA_ABIERTA.checked ? 'SÍ' : 'NO' };
    const b = $('#btn-guardar-ajustes');
    ocupado(b, true);
    try { S.ajustes = await api('guardarAjustes', datos); pintarCabecera(); aviso('Ajustes guardados.'); } catch (e) { error(e); } finally { ocupado(b, false); }
  });
  $('#a-copia').addEventListener('change', async (ev) => {
    try { S.ajustes = await api('guardarAjustes', { COPIA_AUTOMATICA: ev.target.checked ? 'SÍ' : 'NO' }); aviso(ev.target.checked ? 'Copia semanal activada.' : 'Copia semanal desactivada.'); }
    catch (e) { error(e); ev.target.checked = !ev.target.checked; }
  });
  $('#btn-copia').addEventListener('click', async (ev) => {
    const b = ev.currentTarget;
    ocupado(b, true, 'Copiando…');
    try { const r = await api('copiaSeguridad'); $('#copia-res').innerHTML = `<i class="bi bi-check-circle-fill text-success me-1"></i>Copia creada: <a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.nombre)}</a> · <a href="${esc(r.carpeta)}" target="_blank" rel="noopener">ver carpeta</a>`; }
    catch (e) { error(e); } finally { ocupado(b, false); }
  });
  api('capacidad').then((c) => {
    $('#capacidad').innerHTML = c.epocas.map((e) => {
      const pct = Math.round((e.celdas / c.limite) * 1000) / 10;
      return `<div class="mb-3"><div class="d-flex justify-content-between"><strong>${esc(e.nombre)}</strong><span>${pct} %</span></div>
        <div class="barra-prog my-1"><div style="width:${Math.max(pct, 1)}%;background:${pct > 80 ? 'var(--peligro)' : 'var(--ok)'}"></div></div>
        <div>${numero(e.expedientes)} expedientes · caben unos <strong>${numero(e.caben)}</strong> más${e.central ? ' · en la hoja central' : ' · en su propio archivo'}</div></div>`;
    }).join('') + `<div>Cada época tiene su propio límite de ${numero(c.limite)} celdas. ${c.historialAparte ? `Historial en un archivo aparte (${numero(c.historialFilas)} movimientos).` : `Historial en la hoja central (${numero(c.historialFilas)} movimientos).`}</div>`;
  }).catch((e) => { $('#capacidad').textContent = e.message; });
  $('#btn-ordenar').addEventListener('click', async (ev) => {
    const b = ev.currentTarget;
    ocupado(b, true, 'Ordenando…');
    try { const r = await api('ordenarAhora'); aviso(`Hoja ordenada: ${numero(r.total)} expedientes numerados.`); } catch (e) { error(e); } finally { ocupado(b, false); }
  });
  $('#copiar-url') && $('#copiar-url').addEventListener('click', () => { $('#url-app').select(); navigator.clipboard && navigator.clipboard.writeText($('#url-app').value); aviso('Enlace copiado.'); });
}

/* ---------- Ayuda ---------- */

function vistaAyuda() {
  $('#vista').innerHTML = cabecera('Cómo trabajar', 'Normas para que varias personas vacíen el archivo sin duplicar ni perder expedientes.') + `
    <div class="row g-3">
      <div class="col-lg-7"><div class="panel"><div class="panel-cuerpo">
        <ol class="pasos">
          <li><strong>Elige la época</strong> en la que vas a trabajar (Siglo XIX, 1900–1930…) en el selector del menú o desde la <a href="#" data-ir="portada">Portada</a>.</li>
          <li><strong>Asígnate una carpeta</strong> en <a href="#" data-ir="carpetas">Carpetas</a> («Asignar» y eliges tu nombre). Así nadie más trabajará en ella a la vez.</li>
          <li><strong>Registra los expedientes</strong> en <a href="#" data-ir="nuevo">Nuevo expediente</a>. Al pulsar «Guardar y siguiente» se mantienen tu nombre y la carpeta.</li>
          <li><strong>Mira el panel «Comprobación de duplicados»</strong> mientras escribes: avisa si el alumno ya existe, incluso con grafías antiguas (XIMÉNEZ/JIMÉNEZ, VIDAL/BIDAL, YGLESIAS/IGLESIAS…).</li>
          <li><strong>Si el expediente ya existe</strong>, ábrelo y complétalo en vez de crear otro. Sólo si es otra persona con el mismo nombre, confirma que es un homónimo.</li>
          <li><strong>Marca el estado</strong>: EN PROCESO mientras falten datos, TERMINADO cuando esté completo.</li>
          <li><strong>Al acabar la carpeta</strong>, márcala como «Terminada».</li>
        </ol>
      </div></div></div>
      <div class="col-lg-5"><div class="panel"><div class="panel-cab"><h2>Consejos de escritura</h2></div><div class="panel-cuerpo small">
        <ul class="mb-0">
          <li class="mb-2">Apellidos tal como figuran en el expediente, con la «Y»: <strong>ABADÍA Y CORTINA</strong>. Se guardan en mayúsculas automáticamente.</li>
          <li class="mb-2">Lugar de nacimiento: elige país y, si es España, la provincia. La localidad se escribe a mano (la lista sólo sugiere).</li>
          <li class="mb-2">Fechas incompletas: si sólo consta el año, escribe el año (<em>1852</em>); si consta mes y año, <em>03/1852</em>.</li>
          <li class="mb-2">Si dos personas abren el mismo expediente a la vez, la aplicación avisa y no deja que uno sobrescriba los cambios del otro.</li>
          <li>Todo cambio queda en el historial con su autor y fecha; nada se borra definitivamente.</li>
        </ul>
      </div></div></div>
    </div>`;
}

/* ---------- Portada del archivo ---------- */

async function vistaPortada() {
  const lista = await api('portada');
  const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
  const total = lista.reduce((t, e) => t + e.total, 0);
  $('#vista').innerHTML = `
    <div class="portada-hero">
      <h1 class="serif">${esc(S.ajustes.NOMBRE_APP || 'Archivo histórico del IES Goya')}</h1>
      <p>${esc(S.ajustes.SUBTITULO || '')}${S.ajustes.SUBTITULO ? ' · ' : ''}${numero(total)} expedientes registrados en ${lista.length} ${lista.length === 1 ? 'época' : 'épocas'}.</p>
      <div class="sello d-none d-md-inline-flex">G</div>
    </div>
    <div class="row g-3">
      ${lista.map((e) => `<div class="col-md-6 col-xl-4"><div class="tarjeta-epoca${e.CODIGO === S.epoca ? ' actual' : ''}">
        <div class="anos">${esc(anosEpoca(e))}</div>
        <h2>${esc(e.NOMBRE)} ${e.ESTADO === 'CERRADA' ? '<span class="etiqueta align-middle">Cerrada</span>' : ''}</h2>
        ${e.DESCRIPCION ? `<div class="small text-suave">${esc(e.DESCRIPCION)}</div>` : ''}
        <div class="cifras">
          <div><strong>${numero(e.total)}</strong><span>expedientes</span></div>
          <div><strong>${numero(e.carpetasTerminadas)}<small class="fs-6 text-suave">/${numero(e.carpetas)}</small></strong><span>carpetas terminadas</span></div>
          <div><strong>${numero(e.ilustres)}</strong><span>ilustres</span></div>
        </div>
        <div class="barra-prog mb-1"><div style="width:${pct(e.terminados, e.total)}%"></div></div>
        <div class="small text-suave mb-3">${pct(e.terminados, e.total)} % de expedientes terminados · ${numero(e.digitalizados)} digitalizados</div>
        <div class="mt-auto d-flex gap-2">
          <button class="btn btn-primary btn-sm" data-entrar="${esc(e.CODIGO)}"><i class="bi bi-box-arrow-in-right me-1"></i>Entrar</button>
          <button class="btn btn-light btn-sm" data-entrar="${esc(e.CODIGO)}" data-destino="indice"><i class="bi bi-sort-alpha-down me-1"></i>Índice</button>
        </div>
      </div></div>`).join('')}
      ${puede('ADMIN') ? `<div class="col-md-6 col-xl-4"><div class="tarjeta-epoca nueva" id="btn-nueva-epoca"><i class="bi bi-plus-circle mb-2"></i>
        <strong class="text-body">Añadir una época</strong><span class="small">1900–1930, 1930–1975…<br>Cada época tiene su propio archivo y capacidad.</span></div></div>` : ''}
    </div>
    ${S.epocas.length > 1 ? `<div class="panel mt-3"><div class="panel-cuerpo d-flex flex-wrap align-items-center gap-2">
      <i class="bi bi-search text-suave"></i><span class="me-2">¿Buscas a alguien y no sabes de qué época es?</span>
      <button class="btn btn-sm btn-outline-primary" id="buscar-todas">Buscar en todo el archivo</button></div></div>` : ''}`;
  $$('[data-entrar]').forEach((b) => b.addEventListener('click', async () => {
    if (b.dataset.entrar !== S.epoca) await cambiarEpoca(b.dataset.entrar, false);
    ir(b.dataset.destino || 'inicio');
  }));
  $('#btn-nueva-epoca') && $('#btn-nueva-epoca').addEventListener('click', () => editarEpoca(null));
  $('#buscar-todas') && $('#buscar-todas').addEventListener('click', () => { S.busqueda.todas = true; ir('buscar'); });
}

/* ---------- Coordinación: épocas ---------- */

function vistaEpocas() {
  $('#vista').innerHTML = cabecera('Épocas del archivo',
    'Cada época guarda sus alumnos y carpetas en su propio archivo de Google (con su propia capacidad). Profesorado, campos y ajustes son comunes a todas.',
    '<button class="btn btn-primary" id="btn-nueva"><i class="bi bi-plus-lg me-1"></i> Nueva época</button>') + `
    <div class="panel"><div class="table-responsive"><table class="table tabla">
      <thead><tr><th>Código</th><th>Nombre</th><th>Años</th><th>Prefijo del nº</th><th>Estado</th><th></th></tr></thead>
      <tbody>${S.epocas.map((e) => `<tr><td class="id-exp">${esc(e.CODIGO)}</td><td><strong>${esc(e.NOMBRE)}</strong>${e.DESCRIPCION ? `<div class="small text-suave">${esc(e.DESCRIPCION)}</div>` : ''}</td>
        <td>${esc(anosEpoca(e))}</td><td class="id-exp">${esc(e.PREFIJO)}000001</td>
        <td>${e.ESTADO === 'CERRADA' ? '<span class="etiqueta">Cerrada</span>' : '<span class="etiqueta e-TERMINADO">Abierta</span>'}</td>
        <td class="text-end"><button class="btn btn-sm btn-light" data-epoca="${esc(e.CODIGO)}"><i class="bi bi-pencil"></i></button></td></tr>`).join('')}</tbody>
    </table></div></div>
    <div class="panel mt-3"><div class="panel-cuerpo small text-suave">
      <strong class="text-body">Cerrar una época</strong> impide que el profesorado añada o modifique expedientes (la coordinación sí puede). Útil cuando se termina de vaciar.
      El <strong>prefijo</strong> es el comienzo del número de orden de esa época (p. ej. GOYA000001 en el siglo XIX, GOYA1900-000001 en 1900–1930).
    </div></div>`;
  $('#btn-nueva').addEventListener('click', () => editarEpoca(null));
  $$('[data-epoca]').forEach((b) => b.addEventListener('click', () => editarEpoca(epocaPorCodigo(b.dataset.epoca))));
}

const EPOCAS_SUGERIDAS = [['1900_1930', '1900–1930', '1900', '1930'], ['1930_1975', '1930–1975', '1930', '1975'], ['1975_2000', '1975–2000', '1975', '2000'], ['2000_HOY', 'Desde 2000', '2000', '']];

function editarEpoca(e) {
  const nueva = !e;
  const sug = nueva ? (EPOCAS_SUGERIDAS.find((x) => !S.epocas.some((y) => y.CODIGO === x[0])) || ['', '', '', '']) : null;
  const v = e || { CODIGO: sug[0], NOMBRE: sug[1], DESDE: sug[2], HASTA: sug[3], PREFIJO: sug[2] ? 'GOYA' + sug[2] + '-' : '', ESTADO: 'ABIERTA', DESCRIPCION: '' };
  abrirModal(nueva ? 'Nueva época' : 'Época: ' + esc(e.NOMBRE), `
    <form id="form-epoca" class="row g-3">
      <div class="col-md-4"><label class="form-label">Código</label><input class="form-control font-monospace" name="CODIGO" value="${esc(v.CODIGO)}" ${nueva ? '' : 'disabled'} placeholder="1900_1930">
        <div class="form-text">Letras, números y «_». No se puede cambiar después.</div></div>
      <div class="col-md-8"><label class="form-label">Nombre</label><input class="form-control" name="NOMBRE" value="${esc(v.NOMBRE)}" placeholder="1900–1930" required></div>
      <div class="col-6 col-md-3"><label class="form-label">Desde (año)</label><input class="form-control" name="DESDE" inputmode="numeric" value="${esc(v.DESDE)}"></div>
      <div class="col-6 col-md-3"><label class="form-label">Hasta (año)</label><input class="form-control" name="HASTA" inputmode="numeric" value="${esc(v.HASTA)}"></div>
      <div class="col-md-6"><label class="form-label">Prefijo del número de orden</label><input class="form-control font-monospace" name="PREFIJO" value="${esc(v.PREFIJO)}" placeholder="GOYA1900-">
        <div class="form-text">Ejemplo de número: <span class="id-exp">${esc(v.PREFIJO || 'GOYA')}000001</span></div></div>
      <div class="col-12"><label class="form-label">Descripción</label><input class="form-control" name="DESCRIPCION" value="${esc(v.DESCRIPCION)}" placeholder="Expedientes de los alumnos que ingresaron entre…"></div>
      ${nueva ? `<div class="col-md-6"><label class="form-label">Crear carpetas numeradas</label><input type="number" class="form-control" name="carpetas" value="40" min="0" max="2000">
        <div class="form-text">Se pueden añadir más después.</div></div>`
        : `<div class="col-md-6"><label class="form-label">Estado</label><select class="form-select" name="ESTADO">${opcionesHtml([{ v: 'ABIERTA', t: 'Abierta (se puede trabajar)' }, { v: 'CERRADA', t: 'Cerrada (sólo coordinación)' }], v.ESTADO)}</select></div>`}
      ${nueva ? '<div class="col-12"><div class="alert alert-info small mb-0"><i class="bi bi-info-circle me-1"></i>Se creará un archivo de Google nuevo para esta época, en la misma carpeta de Drive que la hoja central, con su propia capacidad. Tarda unos segundos.</div></div>' : ''}
    </form>`,
    `<button class="btn btn-light" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary" id="btn-guardar-epoca">${nueva ? 'Crear época' : 'Guardar'}</button>`, '');
  $('#btn-guardar-epoca').addEventListener('click', async (ev) => {
    const f = $('#form-epoca');
    const datos = Object.fromEntries(new FormData(f).entries());
    if (!nueva) datos.CODIGO = e.CODIGO;
    ocupado(ev.currentTarget, true, nueva ? 'Creando…' : 'Guardando…');
    try {
      if (nueva) {
        const r = await api('crearEpoca', datos);
        S.epocas = r.epocas;
        cerrarModal();
        aviso(`Época «${datos.NOMBRE}» creada.`);
        await cambiarEpoca(r.codigo, false);
        ir('portada');
      } else {
        S.epocas = await api('guardarEpoca', datos);
        cerrarModal(); aviso('Época guardada.'); pintarCabecera(); ir(S.vista);
      }
    } catch (err) { error(err); ocupado($('#btn-guardar-epoca'), false); }
  });
}

/* ---------- Inicio ---------- */
arrancar();
</script>
