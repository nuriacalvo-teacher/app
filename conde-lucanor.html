<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Los 15 exemplos de Lucanor</title>
<meta name="description" content="App de repaso autocorregible de 15 cuentos de El conde Lucanor: fichas, enseñanzas, aplicación actual, ejercicios, respuestas escritas corregidas y simulacro de examen.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --bg:#f1f0ea; --surface:#fbfaf6; --surface2:#f5f3ec; --ink:#1c2130; --muted:#5a5f6d; --line:#d8d4c8;
  --lapis:#27449a; --lapis-ink:#ffffff; --lapis-soft:#e2e7f5;
  --rubric:#ae3127; --rubric-soft:#f7e3df;
  --gold:#9c7118; --gold-soft:#f3ead3;
  --ok:#2a7648; --ok-soft:#dff0e5;
  --warn:#8a5a00; --warn-soft:#fbefd2;
  --shadow:0 1px 2px rgba(28,33,48,.06),0 6px 20px rgba(28,33,48,.06);
  --f-display:"IM Fell English","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-sc:"IM Fell English SC","IM Fell English",Georgia,serif;
  --f-body:"Literata",Georgia,"Times New Roman",serif;
  --f-ui:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11141b; --surface:#191d27; --surface2:#1f2430; --ink:#e8e5dc; --muted:#a4a8b4; --line:#2e3441;
    --lapis:#8fa7ee; --lapis-ink:#0f1320; --lapis-soft:#1f2946;
    --rubric:#ee8175; --rubric-soft:#3a201e;
    --gold:#d9b25f; --gold-soft:#342a17;
    --ok:#72d19a; --ok-soft:#16301f;
    --warn:#e8bf62; --warn-soft:#352914;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11141b; --surface:#191d27; --surface2:#1f2430; --ink:#e8e5dc; --muted:#a4a8b4; --line:#2e3441;
  --lapis:#8fa7ee; --lapis-ink:#0f1320; --lapis-soft:#1f2946;
  --rubric:#ee8175; --rubric-soft:#3a201e;
  --gold:#d9b25f; --gold-soft:#342a17;
  --ok:#72d19a; --ok-soft:#16301f;
  --warn:#e8bf62; --warn-soft:#352914;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lapis);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}

/* Barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top-in{max-width:960px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-sc);font-size:1.25rem;letter-spacing:.02em;color:var(--ink);background:none;border:0;padding:0;cursor:pointer;margin-right:auto;display:flex;align-items:baseline;gap:8px}
.brand b{color:var(--rubric);font-weight:400}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:1px solid transparent;border-radius:999px;padding:6px 12px;cursor:pointer;color:var(--muted);font-weight:700;font-size:.92rem}
nav button:hover{color:var(--ink);background:var(--surface2)}
nav button[aria-current="page"]{color:var(--lapis);border-color:var(--lapis);background:var(--lapis-soft)}

main{max-width:960px;margin:0 auto;padding-inline:16px;padding-block:24px 64px}
.view{display:grid;gap:22px}

/* Tipos de texto */
.eyebrow{font-family:var(--f-ui);font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--rubric);font-weight:700}
.h1{font-family:var(--f-display);font-weight:400;font-size:clamp(2.1rem,6vw,3.4rem);line-height:1.05}
.h2{font-family:var(--f-display);font-weight:400;font-size:clamp(1.6rem,4vw,2.1rem);line-height:1.15}
.h3{font-family:var(--f-ui);font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.lead{font-family:var(--f-body);font-size:1.08rem;max-width:62ch;color:var(--ink)}
.muted{color:var(--muted)}
.serif{font-family:var(--f-body)}

/* Botones */
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:10px 18px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--lapis)}
.btn.primary{background:var(--lapis);border-color:var(--lapis);color:var(--lapis-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 12px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Portada */
.hero{display:grid;gap:14px;padding-block:8px 4px}
.hero .h1 em{font-style:italic;color:var(--rubric)}
.marco{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px}
.pasos{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;counter-reset:p}
.pasos li{counter-increment:p;background:var(--surface2);border-radius:8px;padding:12px;font-size:.92rem;display:grid;gap:4px}
.pasos li::before{content:counter(p);font-family:var(--f-display);font-size:1.6rem;line-height:1;color:var(--rubric)}
.pasos b{font-size:.95rem}

.mapa{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.chip-c{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer}
.chip-c:hover{border-color:var(--lapis)}
.chip-c .rn{grid-row:span 2;font-family:var(--f-sc);font-size:1.05rem;color:var(--rubric);min-width:3.4ch;text-align:center}
.chip-c .nm{font-size:.86rem;font-weight:700;line-height:1.2}
.bar{height:5px;border-radius:9px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:9px;transition:width .4s}
.bar.mid i{background:var(--gold)}
.bar.low i{background:var(--rubric)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}

/* Tarjetas de modos */
.modos{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.modo{display:grid;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer}
.modo:hover{border-color:var(--lapis);box-shadow:var(--shadow)}
.modo .t{font-family:var(--f-display);font-size:1.3rem;line-height:1.15}
.modo .d{font-size:.9rem;color:var(--muted)}
.modo .k{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}
.modo.destacado{background:var(--lapis-soft);border-color:var(--lapis)}

/* Lista de cuentos */
.lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card-c{display:grid;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;align-content:start}
.card-c:hover{border-color:var(--lapis);box-shadow:var(--shadow)}
.card-c .rn{font-family:var(--f-sc);color:var(--rubric);font-size:.95rem;letter-spacing:.04em}
.card-c .nm{font-family:var(--f-display);font-size:1.35rem;line-height:1.15}
.card-c .en{font-family:var(--f-body);font-size:.92rem;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:700;color:var(--muted);font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.scroll-x{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.tabla{border-collapse:collapse;width:100%;min-width:760px;font-size:.9rem}
.tabla th,.tabla td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.tabla th{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--surface2)}
.tabla td.rn{font-family:var(--f-sc);color:var(--rubric);white-space:nowrap}
.tabla td.mor{font-family:var(--f-body);font-style:italic}
.tabla tr:last-child td{border-bottom:0}

/* Ficha */
.ficha{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,4vw,36px);display:grid;gap:26px}
.ficha-head{display:grid;gap:8px;border-bottom:1px solid var(--line);padding-bottom:18px}
.ficha-head .orig{font-family:var(--f-body);font-style:italic;color:var(--muted)}
.sec{display:grid;gap:10px}
.sec p,.sec li{font-family:var(--f-body);font-size:1.02rem;max-width:66ch}
.sec ul{margin:0;padding-left:1.2em;display:grid;gap:8px}
.relato p+p{margin-top:10px}
.relato p:first-of-type::first-letter{font-family:var(--f-display);float:left;font-size:3.4em;line-height:.8;padding:6px 8px 0 0;color:var(--rubric)}
.problema{background:var(--surface2);border-radius:8px;padding:14px 16px}
.problema p{font-family:var(--f-body)}
.personajes{display:flex;flex-wrap:wrap;gap:6px}
.personajes span{background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.88rem}
.verso{font-family:var(--f-display);font-style:italic;font-size:clamp(1.25rem,3.4vw,1.6rem);line-height:1.35;color:var(--ink);border-left:3px solid var(--rubric);padding:4px 0 4px 18px}
.verso+.verso{margin-top:6px}
.clave{background:var(--lapis-soft);border-radius:8px;padding:16px}
.clave p{font-size:1.08rem}
.ojo{background:var(--gold-soft);border-radius:8px;padding:14px 16px}
.ojo .h3{color:var(--gold)}
.piensa{border:1px dashed var(--line);border-radius:8px;padding:14px 16px}
.ficha-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px}

/* Quiz */
.quiz{display:grid;gap:16px}
.qhead{display:grid;gap:8px}
.progress{height:8px;border-radius:9px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.progress i{display:block;height:100%;background:var(--lapis);transition:width .3s}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(16px,4vw,28px);display:grid;gap:16px;box-shadow:var(--shadow)}
.qtag{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.qtag .t1{color:var(--rubric)}
.qtag .t2{color:var(--muted)}
.qtext{font-family:var(--f-body);font-size:1.15rem;line-height:1.45}
.qtext .cita{display:block;margin-top:8px;font-family:var(--f-display);font-style:italic;font-size:1.25rem;color:var(--ink);border-left:3px solid var(--rubric);padding-left:14px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface2);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;font-family:var(--f-body);font-size:1rem}
.opt:hover:not(:disabled){border-color:var(--lapis)}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font-family:var(--f-ui);font-size:.8rem;font-weight:700;background:var(--surface)}
.opt[aria-pressed="true"]{border-color:var(--lapis);background:var(--lapis-soft)}
.opt[aria-pressed="true"] .l{background:var(--lapis);color:var(--lapis-ink);border-color:var(--lapis)}
.opt.is-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.is-ok .l{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.is-bad{border-color:var(--rubric);background:var(--rubric-soft)}
.opt.is-bad .l{background:var(--rubric);border-color:var(--rubric);color:var(--surface)}
.opt:disabled{cursor:default}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf .opt{justify-content:center;font-family:var(--f-ui);font-weight:700}
.field{width:100%;border:1.5px solid var(--line);border-radius:10px;background:var(--surface2);padding:12px 14px;font-family:var(--f-body);font-size:1.05rem}
.field:focus{border-color:var(--lapis);outline:none}
textarea.field{min-height:180px;resize:vertical;line-height:1.55}
.counter{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.gap-verso{font-family:var(--f-display);font-style:italic;font-size:1.3rem;line-height:1.5;border-left:3px solid var(--rubric);padding-left:14px}
.orden{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.orden li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--surface2);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-family:var(--f-body)}
.orden .n{font-family:var(--f-display);font-size:1.3rem;color:var(--rubric);width:1.6ch;text-align:center}
.orden .mv{display:flex;gap:4px}
.orden .mv button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}
.orden .mv button:disabled{opacity:.3;cursor:default}
.orden li.is-ok{border-color:var(--ok);background:var(--ok-soft)}
.orden li.is-bad{border-color:var(--rubric);background:var(--rubric-soft)}
.match{display:grid;gap:10px}
.match .mrow{display:grid;grid-template-columns:1fr minmax(0,240px);gap:10px;align-items:center;background:var(--surface2);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
.match .mrow p{font-family:var(--f-display);font-style:italic;font-size:1.08rem}
.match select{width:100%;padding:8px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface)}
.match .mrow.is-ok{border-color:var(--ok);background:var(--ok-soft)}
.match .mrow.is-bad{border-color:var(--rubric);background:var(--rubric-soft)}
@media (max-width:560px){.match .mrow{grid-template-columns:1fr}}

/* Feedback */
.fb{border-radius:10px;padding:16px 18px;display:grid;gap:10px;font-family:var(--f-body)}
.fb .ttl{font-family:var(--f-ui);font-weight:700;font-size:1.05rem}
.fb.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.fb.ok .ttl{color:var(--ok)}
.fb.bad{background:var(--rubric-soft);border:1px solid var(--rubric)}
.fb.bad .ttl{color:var(--rubric)}
.fb.mid{background:var(--gold-soft);border:1px solid var(--gold)}
.fb.mid .ttl{color:var(--gold)}
.fb .fix{border-left:3px solid var(--ok);padding-left:12px}
.fb .tip{font-family:var(--f-ui);font-size:.92rem;background:var(--surface);border-radius:8px;padding:10px 12px}
.ideas{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ideas li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;background:var(--surface);border-radius:8px;padding:10px 12px;font-family:var(--f-ui);font-size:.95rem}
.ideas .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem}
.ideas .si .ic{background:var(--ok);color:var(--surface)}
.ideas .no .ic{background:var(--rubric);color:var(--surface)}
.ideas .why{color:var(--muted);font-size:.9rem;margin-top:2px}
.ideas .link{background:none;border:0;color:var(--lapis);text-decoration:underline;cursor:pointer;padding:0;font-size:.85rem;margin-top:4px}
.nota{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.nota .big{font-family:var(--f-display);font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.modelo{background:var(--surface);border-radius:8px;padding:12px 14px}
.modelo summary{cursor:pointer;font-family:var(--f-ui);font-weight:700;color:var(--lapis)}
.modelo p{margin-top:8px}
.aviso{background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:10px 12px;font-family:var(--f-ui);font-size:.92rem}

/* Resultados */
.result{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,4vw,32px);display:grid;gap:18px;text-align:left}
.score{font-family:var(--f-display);font-size:clamp(3.2rem,12vw,5.5rem);line-height:.9;font-variant-numeric:tabular-nums}
.score small{font-size:.35em;color:var(--muted)}
.review{display:grid;gap:14px}
.review .ritem{border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px;background:var(--surface2)}
.review .rq{font-family:var(--f-body);font-weight:600}
.pts{font-variant-numeric:tabular-nums;font-weight:700;font-size:.85rem;color:var(--muted)}

/* Selector de cuentos */
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.picker button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px;cursor:pointer;display:grid;gap:2px}
.picker button:hover{border-color:var(--lapis)}
.picker .rn{font-family:var(--f-sc);color:var(--rubric);font-size:.9rem}
.picker .nm{font-size:.86rem;font-weight:700;line-height:1.2}

/* Modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,12,18,.55);display:grid;place-items:start center;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) 16px 32px}
.modal-in{width:min(820px,100%);display:grid;gap:10px;margin-top:10px}
.modal-close{justify-self:end}

.foot{font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.theme-t{background:none;border:1px solid var(--line);border-radius:999px;width:36px;height:36px;cursor:pointer;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{from{transform:translateY(4px);opacity:.4}to{transform:none;opacity:1}}
.fb{animation:pop .25s ease-out}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <button class="brand" id="brand" type="button">Lucanor <b>·</b> <span class="muted" style="font-family:var(--f-ui);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase">15 exemplos</span></button>
    <nav aria-label="Secciones">
      <button type="button" data-go="inicio">Inicio</button>
      <button type="button" data-go="cuentos">Cuentos</button>
      <button type="button" data-go="practicar">Practicar</button>
      <button type="button" data-go="examen">Examen</button>
    </nav>
  </div>
</header>
<main id="app"></main>
<div class="modal" id="modal" hidden><div class="modal-in"><button class="btn sm modal-close" id="modalClose" type="button">Cerrar ✕</button><div id="modalBody"></div></div></div>
<script>
/* =========================================================
   DATOS: los 15 exemplos (según la edición del PDF de clase)
   Patrones (p): se comparan con el texto del alumno en minúsculas
   y SIN tildes (la ñ se convierte en n).
   ========================================================= */
const CUENTOS = [
{
  id:'I', corto:'El rey y su privado',
  titulo:'Lo que sucedió a un rey y a un ministro suyo',
  claves:'privad|ministr|cautiv|penitencia|desierto|harapo|mendig',
  problema:'Un hombre ilustre, rico y amigo del conde le dice en secreto que quiere marcharse de sus tierras para siempre y dejarle todas sus posesiones (unas vendidas y otras a su cuidado). Al conde le parece un honor muy útil, pero pide consejo.',
  personajes:['El rey','El privado (ministro de confianza)','Los otros privados, envidiosos','Un sabio filósofo, cautivo en casa del privado','La reina y el infante heredero'],
  resumen:[
    'Un rey confiaba muchísimo en su privado. Los demás consejeros, envidiosos, le acusan de querer quedarse con el reino: dicen que planea la muerte del infante para hacerse con el trono.',

    'Siguiendo el consejo, el privado se rapa la cabeza y la barba, se viste de mendigo con un bordón y cose doblas de oro en sus harapos. Antes del amanecer va a palacio y le dice al rey que quiere acompañarle en su penitencia, porque si el rey deja todo, él tampoco quiere nada.',

  secuencia:[

  consejo:'Patronio dice al conde que ese amigo seguramente solo quiere probarle. Debe hablar con él y demostrarle que busca su honra y provecho, sin ambicionar sus bienes, porque «la amistad no puede durar mucho cuando se ambicionan las riquezas de un amigo».',

  moraleja2:['Con la ayuda de Dios y con buen consejo,','sale el hombre de angustias y cumple su deseo.'],
  hueco:{txt:'No penséis ni creáis que por un ______ / hacen algo los hombres que les sea un peligro.', ans:['amigo']},
  ensenanza:'Desconfía de las ofertas demasiado generosas: pueden ser una prueba o una trampa. No muestres ambición por lo que tienen tus amigos, y pide consejo a alguien sabio cuando algo te parezca demasiado bueno.',

  ojo:'Este cuento tiene DOS moralejas en verso (es el único de los 15). Y no confundas al privado con el sabio: el que da el consejo clave es el cautivo filósofo, no el privado.',

  ideasResumen:[

    {t:'El rey le pone a prueba: dice que se irá al desierto y le dejará el reino', p:['prueb|probar|probarl|desierto|penitencia|retirar|dejar(le)? el reino|dejarle todo|le dejaria|tutela|irse del reino|abandonar el reino'], why:'El núcleo del cuento es la PRUEBA: el rey finge que se va a hacer penitencia y le deja el reino y al infante.'},
    {t:'Un sabio cautivo le avisa de la trampa', p:['cautiv|sabio|filosof'], why:'El personaje clave es el sabio cautivo que vive en casa del privado: él descubre que todo es una prueba.'},
    {t:'El privado se disfraza de mendigo y dice que acompañará al rey', p:['mendig|harapo|disfraz|rap(o|a|ó)|pobre|acompan|irse con el|ir con el|seguirle|seguirlo|bordon|doblas'], why:'El desenlace: el privado aparece vestido de mendigo, dispuesto a irse con el rey. Así demuestra que no quiere el poder.'},
    {t:'El rey comprueba su lealtad', p:['leal|fiel|fidelidad|confia|se salva|salvo'], why:'Hay que cerrar el resumen: el rey queda convencido de su lealtad y el privado se salva.'}

  ideasEnsenanza:[

    {t:'No ambicionar los bienes del amigo', p:['ambici|codici|interes|bienes|riqueza|aprovech|poder'], why:'Patronio insiste: la amistad no dura cuando se ambicionan las riquezas del amigo.'},
    {t:'El valor del buen consejo', p:['consej|sabio|ayuda de dios|pedir opinion|escuchar'], why:'La segunda moraleja: «con la ayuda de Dios y con buen consejo, sale el hombre de angustias».'}
  ],
  modeloResumen:'Un rey confiaba mucho en su privado, pero los otros privados, por envidia, le acusaron de querer quedarse con el reino. Para probarlo, el rey le dijo que quería irse al desierto a hacer penitencia y dejarle el reino y la tutela de su hijo. El privado se alegró, pero un sabio cautivo que vivía en su casa le advirtió de que era una prueba. Siguiendo su consejo, el privado se rapó, se vistió de mendigo y fue a palacio a decirle al rey que quería acompañarle en su penitencia. Así el rey comprobó su lealtad y el privado se salvó.',
  modeloEnsenanza:'Enseña a desconfiar de las ofertas demasiado generosas, porque nadie hace por un amigo algo que le perjudique: pueden ser una prueba. No hay que mostrar ambición por los bienes del amigo, y un buen consejo nos saca de apuros.',

      {t:'Porque el sabio cautivo le había aconsejado hacerlo.', why:'¡Cuidado con los papeles! El sabio cautivo aconseja al PRIVADO, no al rey. El rey actúa por las acusaciones de los envidiosos.'},

      {t:'La reina.', why:'La reina solo se menciona como parte de lo que el rey dejaría al privado. No descubre nada.'},
      {t:'El propio privado, que era muy listo.', why:'El privado se lo cree y se alegra. Sin el cautivo, habría caído en la trampa.'},
      {t:'El guardia de la puerta de palacio.', why:'El guardia solo se asombra al ver al privado vestido de mendigo y avisa al rey.'}]},
    {tf:1, q:'El privado se presenta en palacio vestido de mendigo, con la cabeza rapada y oro cosido en la ropa.', a:true, why:'Verdadero. Es el disfraz que le aconseja el sabio: parece un penitente dispuesto a acompañar al rey.'},

    {q:'¿Qué le aconseja Patronio al conde Lucanor?', o:[

      {t:'Que se vista de mendigo como el privado.', why:'El disfraz es parte del cuento, no del consejo. Patronio aplica la idea, no copia la acción.'},

{
  id:'II', corto:'El padre, el hijo y la bestia',
  titulo:'Lo que sucedió a un hombre bueno con su hijo',
  claves:'bestia|cabalgadura|burro|asno|mercado|montad|a pie|critic',
  problema:'El conde quiere hacer algo, pero sabe que si lo hace muchos le criticarán, y si no lo hace también. No sabe qué decidir.',
  personajes:['Un buen hombre, labrador','Su hijo, listo pero sin experiencia','Varios grupos de gente por el camino','La bestia (cabalgadura)'],
  resumen:[
    'Un labrador tenía un hijo muy listo, pero sin experiencia, que siempre ponía pegas a lo que hacía su padre. Para enseñarle una lección, el padre lo lleva al mercado con una bestia de carga.',
    'Primero van los dos a pie y la bestia sin carga: unos hombres dicen que son tontos. El hijo les da la razón y el padre le manda subir.',
    'Luego critican que el joven vaya montado y el anciano a pie. Cambian: sube el padre, y otros critican que el viejo, acostumbrado a trabajar, vaya cómodo mientras el chico camina.',
    'Suben los dos, y otros dicen que la bestia está tan flaca que es cruel ir montados en ella. Cada vez el hijo cree que tienen razón.',
    'El padre le explica: han probado todas las combinaciones y siempre les han criticado. Nunca harás algo que todos aprueben, así que haz lo que te convenga, siempre que no sea malo.'
  ],
  secuencia:[
    'Van los dos a pie y la bestia sin carga: les llaman poco juiciosos.',
    'Sube el hijo y el padre va a pie: critican al joven.',
    'Sube el padre y el hijo va a pie: critican la dureza del padre.',
    'Suben los dos: critican que maltratan a la bestia flaca.',
    'El padre explica al hijo que nunca harán algo que todos aprueben.'
  ],
  consejo:'Patronio aconseja al conde que mire el daño o provecho que le puede causar, que no se fíe solo de su juicio ni de su deseo y que pida consejo a personas inteligentes, leales y que guarden el secreto. Si no las encuentra, que deje pasar al menos un día y una noche antes de decidir. Y que no deje de hacer algo bueno por miedo a las críticas.',
  moraleja:['Por críticas de gentes, mientras no hagáis mal,','buscad vuestro provecho y no os dejéis llevar.'],
  hueco:{txt:'Por ______ de gentes, mientras no hagáis mal, / buscad vuestro provecho y no os dejéis llevar.', ans:['criticas']},
  ensenanza:'Es imposible contentar a todo el mundo. Si lo que haces no es malo y te conviene, hazlo sin dejarte llevar por el «qué dirán». Eso sí: piénsalo bien y pide consejo antes.',
  ensenanzaCorta:'es imposible contentar a todos, así que no hay que dejarse llevar por el qué dirán',
  hoy:[
    'Redes sociales: publiques lo que publiques, alguien lo criticará. Si no haces daño a nadie, no vivas pendiente de los comentarios.',
    'Elegir optativa, bachillerato o deporte: unos te dirán que es muy difícil, otros que es de «flojos». Decide por lo que te conviene a ti.',
    'El consejo práctico de Patronio sigue valiendo: si dudas, consúltalo con alguien de confianza y «consúltalo con la almohada» (un día y una noche).'
  ],
  ojo:'El texto dice «bestia» o «cabalgadura», no dice «burro» (aunque en otras versiones es un asno). Y la moraleja NO dice «haz lo que quieras»: dice «mientras no hagáis mal». Además, una nota del libro cuenta que don Juan Manuel aplicó esta idea a su vida: le criticaban por escribir libros y siguió escribiendo.',
  critica:'¿Significa esto que nunca hay que escuchar las críticas? No: Patronio también dice que pidas consejo a gente leal e inteligente. La clave es distinguir críticas útiles de ruido.',
  ideasResumen:[
    {t:'Un padre y su hijo (listo pero sin experiencia)', p:['padre|hijo|labrador|buen hombre'], why:'Presenta a los personajes: un buen hombre y su hijo, listo pero inexperto, que siempre ponía pegas.'},
    {t:'Van al mercado con una bestia', p:['bestia|cabalgadura|burro|asno|animal|mula|caballo|mercado'], why:'Menciona el viaje al mercado con la bestia de carga: es el escenario de la lección.'},
    {t:'Prueban varias formas de ir (a pie, montado uno, el otro, los dos)', p:['a pie|montad|mont(a|o|an|aron)|subi|sube|los dos|ambos|combinacion|de todas las formas|todas las maneras'], why:'Tienes que contar que prueban TODAS las combinaciones: los dos a pie, el hijo montado, el padre montado y los dos montados.'},
    {t:'Siempre alguien les critica', p:['critic|censur|murmur|comentar|opin|decian|reproch|quejab'], why:'Lo esencial: en cada caso la gente que encuentran les critica.'},
    {t:'El padre enseña que nunca se contenta a todos', p:['nunca|todos|contentar|aprueb|imposible|leccion|ensen|explica'], why:'El final: el padre explica al hijo que haga lo que haga siempre le criticarán, así que no debe guiarse por eso.'}
  ],
  ideasEnsenanza:[
    {t:'Es imposible contentar a todos / siempre te criticarán', p:['todos|todo el mundo|contentar|siempre (te )?critic|nunca.*aprueb|imposible|siempre habra'], why:'La base de la enseñanza: haga lo que haga, alguien criticará.'},
    {t:'No dejarse llevar por el qué dirán', p:['que diran|opinion de los demas|criticas|no (te )?dej(es|arse)|no hacer caso|no importa lo que|ignorar|presion'], why:'La moraleja dice «no os dejéis llevar» por las críticas de la gente.'},
    {t:'Siempre que no hagas mal / pensarlo y pedir consejo', p:['no (hag|sea|haga).* mal|malo|no hacer dano|consej|pensar|reflexion|provecho|convenga|beneficie'], why:'Matiz importante: solo vale si lo que haces no es malo y te conviene. Patronio además aconseja pensarlo y pedir consejo.'}
  ],
  modeloResumen:'Un buen hombre tenía un hijo listo pero sin experiencia que siempre le ponía pegas. Para enseñarle, lo llevó al mercado con una bestia. Primero fueron los dos a pie y la gente dijo que eran tontos; luego subió el hijo y criticaron que el padre anciano fuera andando; después subió el padre y criticaron su dureza con el chico; al final subieron los dos y dijeron que maltrataban al animal. El padre le explicó que, hagan lo que hagan, siempre les criticarán, así que deben hacer lo que les convenga mientras no sea malo.',
  modeloEnsenanza:'Enseña que es imposible contentar a todo el mundo, así que no debemos dejarnos llevar por el qué dirán: si lo que hacemos no es malo y nos conviene, hay que hacerlo, pensándolo antes y pidiendo consejo.',
  preguntas:[
    {q:'¿Cuál es el defecto del hijo al principio del cuento?', o:[
      {t:'Es listo pero inexperto y pone pegas a todo lo que hace su padre.', ok:1, why:'Sí. Patronio dice que los jóvenes agudos saben empezar las cosas, pero no terminarlas.'},
      {t:'Es perezoso y no quiere ir al mercado.', why:'No se dice que sea perezoso. Su problema es que opina demasiado sin experiencia.'},
      {t:'Es cruel con los animales.', why:'Eso es lo que la última gente dice de los DOS al ir montados. No es el defecto del hijo.'},
      {t:'Es muy tímido y nunca da su opinión.', why:'¡Al revés! Da su opinión todo el rato y siempre le da la razón a quien critica.'}]},
    {q:'¿Qué critica el ÚLTIMO grupo de gente?', o:[
      {t:'Que la bestia es flaca y débil y los dos van montados en ella.', ok:1, why:'Correcto: es la cuarta y última combinación.'},
      {t:'Que el padre anciano va a pie.', why:'Esa crítica la hace el segundo grupo, cuando el hijo va montado.'},
      {t:'Que los dos van a pie con la bestia sin carga.', why:'Esa es la primera crítica, al principio del camino.'},
      {t:'Que el hijo joven va a pie.', why:'Esa es la tercera crítica, cuando el padre va montado.'}]},
    {tf:1, q:'El padre organiza la situación a propósito para dar una lección a su hijo.', a:true, why:'Verdadero. El texto dice que actuó así «para aconsejar y mostrar a su hijo cómo debía obrar en futuras empresas».'},
    {q:'Si no encuentra un buen consejero, ¿qué recomienda Patronio?', o:[
      {t:'Dejar pasar al menos un día y una noche antes de decidir.', ok:1, why:'Eso es. Un consejo práctico: no precipitarse.'},
      {t:'Hacer lo que diga la mayoría de la gente.', why:'Eso es justo lo que el cuento critica: la mayoría habla «a su antojo».'},
      {t:'No hacer nada para no ser criticado.', why:'No hacer nada también se critica. El conde ya sabe que le censurarán tanto si actúa como si no.'},
      {t:'Preguntar a su hijo.', why:'No, en el cuento el hijo es precisamente el que se deja llevar.'}]},
    {tf:1, q:'La moraleja anima a hacer cualquier cosa sin importar las críticas.', a:false, why:'Falso. Dice «mientras no hagáis mal». Si algo es malo, las críticas de los buenos sí son justas.'}
  ]
},

  ideasEnsenanza:[

  modeloResumen:'Un cuervo tenía un pedazo de queso en el pico, subido a un árbol. Una zorra que pasaba quiso quitárselo y empezó a halagarle: le alabó sus plumas, sus ojos, su pico y su vuelo, y le dijo que seguro que cantaba mejor que ninguna otra ave. El cuervo, creyéndose tan perfecto, abrió el pico para cantar, se le cayó el queso y la zorra lo cogió y escapó.',

{

  personajes:['El deán de Santiago','Don Illán, el mago de Toledo','La criada de don Illán','El hijo de don Illán'],

  modeloResumen:'Un deán de Santiago fue a Toledo para que don Illán, un mago, le enseñara magia, y le prometió que nunca olvidaría el favor. Don Illán mandó a su criada preparar unas perdices, pero no asarlas hasta que él lo ordenase. Después, el deán fue ascendiendo: arzobispo, obispo, cardenal y papa, y cada vez que don Illán le pedía un cargo para su hijo, se lo daba a un familiar. Siendo papa, lo amenazó con encarcelarlo por mago y no le dio ni comida. Entonces don Illán mandó asar las perdices y el deán se encontró en Toledo: todo había sido un encantamiento para probarle. Don Illán lo despidió sin darle de cenar.',

      {t:'Deán → obispo → arzobispo → papa.', why:'Falta el cardenal y el orden no es ese: primero arzobispo de Santiago, luego obispo de Tolosa.'},
      {t:'Deán → cardenal → papa.', why:'Te saltas el arzobispado y el obispado de Tolosa.'},
      {t:'Deán → rey → papa.', why:'No llega a rey. Todos los cargos son eclesiásticos.'}]},
    {q:'¿Con qué amenaza el papa a don Illán?', o:[

{

  resumen:[

  ],
  ideasEnsenanza:[
    {t:'Evitar la mentira y quedarse con la verdad', p:['verdad|mentir|mentira|sincer|honest'], why:'La moraleja: «Evitad la mentira y abrazad la verdad».'},
    {t:'La mentira dura poco / acaba cayendo', p:['cae|dura poco|no dura|corto|acaba|termina|derrumb|pierde|tarde o temprano|fracas|frutos'], why:'Explica por qué: la mentira no tiene raíces y acaba cayendo.'},
    {t:'La verdad sale a la luz / no envidiar a los mentirosos', p:['sale a la luz|se descubre|triunfa|gana|envidi|imitar|al final|perjudic|dano'], why:'Para el 10: la verdad acaba saliendo y no hay que envidiar ni imitar a los mentirosos; quien vive en el mal acaba dañado.'}
  ],
  modeloResumen:'La Verdad y la Mentira plantaron un árbol. La Mentira convenció a la Verdad de que se quedara con las raíces, diciendo que eran lo mejor, y ella se quedó con las ramas. El árbol de la Mentira creció lleno de flores y la gente acudía a su sombra para aprender a mentir. Mientras, la Verdad, bajo tierra, se comió las raíces para alimentarse. Un día el viento derribó el árbol sobre la Mentira y sus seguidores, y la Verdad salió a la luz.',
  modeloEnsenanza:'Enseña que hay que evitar la mentira y quedarse con la verdad. La mentira puede parecer atractiva y triunfar un tiempo, pero no tiene raíces y acaba cayendo, mientras que la verdad termina saliendo a la luz.',
  preguntas:[
    {q:'¿Qué es la «mentira triple»?', o:[
      {t:'Mentir y engañar diciendo la verdad.', ok:1, why:'Sí, la más dañina. Es lo que hizo la zorra con el cuervo (verdades a medias).'},
      {t:'Decir la misma mentira tres veces.', why:'No. El número indica lo sutil y dañina que es, no las repeticiones.'},
      {t:'Hacer promesas solemnes y juramentos mientras se planea el engaño.', why:'Esa es la mentira DOBLE.'},
      {t:'Decir «yo haré tal cosa por vos» sabiendo que es falso.', why:'Esa es la mentira SENCILLA.'}]},
    {q:'¿Con qué parte del árbol se queda la Verdad?', o:[
      {t:'Con las raíces.', ok:1, why:'Correcto. La Mentira la convence de que es la mejor parte… para quitarla de en medio.'},
      {t:'Con las ramas.', why:'No, las ramas son de la Mentira. La Verdad queda escondida bajo tierra.'},
      {t:'Con los frutos.', why:'¡El árbol nunca llega a dar fruto! Cae antes.'},
      {t:'Con las flores.', why:'Las flores (halagos, palabras bonitas) son de la Mentira.'}]},
    {tf:1, q:'La Verdad destruye el árbol a propósito para vengarse.', a:false, why:'Falso. Se come las raíces porque no tiene otro alimento. Es la consecuencia natural del engaño de la Mentira.'},
    {q:'Según Patronio, ¿qué representan las flores del árbol de la Mentira?', o:[
      {t:'Sus palabras, pensamientos o halagos, agradables pero efímeros.', ok:1, why:'Eso es: atraen mucho pero nunca dan buenos frutos.'},
      {t:'Las personas buenas que la siguen.', why:'No; las personas son las «gentes» que se cobijan bajo su sombra.'},
      {t:'Las riquezas de la Verdad.', why:'La Verdad no tiene flores: está bajo tierra.'},
      {t:'Los años que dura la mentira.', why:'No es esa la interpretación del texto.'}]},
    {tf:1, q:'Bajo el árbol de la Mentira, a quien no sabía mentir lo despreciaban.', a:true, why:'Verdadero. Incluso «él mismo se tenía en poco». Es una crítica a una sociedad que premia al mentiroso.'}
  ]

{
  id:'XXXII', corto:'El paño de los burladores',
  titulo:'Lo que sucedió a un rey con los burladores que hicieron el paño',
  claves:'pano|tela|tejedor|burlador|picaro|desnudo|traje|hijo de su padre|palafrenero',
  problema:'Un hombre propone al conde un asunto muy provechoso, pero le exige que no se lo cuente a nadie, ni a las personas de su máxima confianza: si lo cuenta, podría perder su hacienda y su vida.',
  personajes:['Un rey moro','Tres pícaros que dicen ser tejedores','Los criados, el gobernador y el valido','Un palafrenero negro'],
  resumen:[
    'Tres pícaros dijeron a un rey moro que tejían un paño que solo podían ver los que eran hijos de quien pasaba por ser su padre. Al rey le encantó: así sabría quién no era hijo legítimo y se quedaría con sus bienes (entre los moros no heredaban).',
    'Les dio una sala, oro, plata y seda. Ellos fingían tejer. El rey envió a un criado, que no veía nada pero dijo que la tela era preciosa por miedo; luego a otro. Cuando fue el propio rey, tampoco vio nada, pero temió perder el reino y la alabó.',
    'Lo mismo les pasó al gobernador y al valido: nadie se atrevía a decir que no veía la tela, por miedo a la deshonra.',
    'En las fiestas, los pícaros «vistieron» al rey, que salió a caballo por la ciudad totalmente desnudo. Todos callaban. Hasta que un palafrenero negro, «que no tenía honra que perder», le dijo: «O yo soy ciego, o vais desnudo».',
    'El rey le insultó, pero otro repitió lo mismo, y luego otro, hasta que todos perdieron el miedo y reconocieron la verdad. Los pícaros ya habían huido con todo lo que habían estafado.'
  ],
  secuencia:[
    'Tres pícaros ofrecen al rey un paño que solo ven los hijos legítimos.',
    'El rey les da sala, oro, plata y seda, y ellos fingen tejer.',
    'Los criados, el rey, el gobernador y el valido fingen ver la tela por miedo.',
    'El rey sale desnudo a caballo en las fiestas.',
    'Un palafrenero dice: «O yo soy ciego, o vais desnudo».',
    'Todos reconocen la verdad, pero los pícaros ya han huido.'
  ],
  consejo:'Patronio advierte al conde que, si alguien le pide que las personas de su confianza no sepan lo que le propone, está seguro de que quiere engañarle: quien apenas le conoce no tiene motivos para buscar su bien, mientras que quienes han vivido con él siempre le servirán y favorecerán.',
  moraleja:['A quien te aconseja encubrir de tus amigos','más le gusta engañarte que los higos.'],
  hueco:{txt:'A quien te aconseja encubrir de tus amigos / más le gusta engañarte que los ______.', ans:['higos']},
  ensenanza:'Desconfía de quien te pide que ocultes algo a tus amigos o familia: suele querer engañarte. Además, el miedo al qué dirán puede hacer que todos callen ante una mentira evidente; hace falta valor para decir la verdad.',
  ensenanzaCorta:'hay que desconfiar de quien nos pide ocultar algo a nuestros amigos, y atreverse a decir la verdad',
  hoy:[
    'Un desconocido en internet que te dice «no se lo cuentes a tus padres»: esa frase es una señal de alarma clarísima (grooming, estafas).',
    'Presión de grupo: todos dicen que algo mola o que es verdad y nadie se atreve a llevar la contraria. Hace falta un «palafrenero».',
    'Estafas que piden secreto: «esta inversión es solo para ti, no se lo digas a nadie».'
  ],
  ojo:'Este cuento inspiró «El traje nuevo del emperador» de Andersen (siglo XIX). En examen: el paño solo lo ven los hijos «de quien pasaba por ser su padre». El que dice la verdad es el palafrenero (criado que lleva el caballo por el freno), que no tiene honra que perder.',
  critica:'Una nota del libro explica que en la Edad Media la honra se consideraba un privilegio de la gente de alta posición. Por eso se presenta al palafrenero como alguien «sin honra que perder»: refleja los prejuicios de clase y de raza de la época. Hoy, justo él es el más valiente y honesto del cuento.',
  ideasResumen:[
    {t:'Tres pícaros engañan a un rey', p:['picaro|burlador|tejedor|estafador|enganador|granuja|tres'], why:'Presenta a los tres pícaros que se hacen pasar por tejedores.'},
    {t:'Un paño que solo ven los hijos legítimos', p:['pano|tela|traje|tejido|hijo|legitim|padre'], why:'La trampa: un paño que solo pueden ver los que son hijos de quien pasa por ser su padre.'},
    {t:'Nadie se atreve a decir que no lo ve (miedo a la deshonra)', p:['miedo|temor|honra|deshonra|no se atrev|nadie (se atrev|dec)|callan|callad|fing|alab|mient'], why:'El nudo: todos (criados, rey, gobernador, valido) fingen verla por miedo a perder la honra.'},
    {t:'El rey sale desnudo', p:['desnud|sin ropa|sale|fiesta|caballo'], why:'El clímax: el rey sale desnudo a caballo en las fiestas.'},
    {t:'Un palafrenero dice la verdad y se descubre el engaño', p:['palafrenero|negro|criado|mozo|ciego|verdad|descubr|dice que va desnudo'], why:'El desenlace: un palafrenero dice «o yo soy ciego, o vais desnudo» y todos pierden el miedo; los pícaros ya han huido.'}
  ],
  ideasEnsenanza:[
    {t:'Desconfiar de quien pide ocultar algo a tus amigos', p:['secreto|ocult|encubr|escond|no (se lo )?cuent|no (se lo )?dig|amigos|confianza'], why:'La moraleja: «A quien te aconseja encubrir de tus amigos…».'},
    {t:'Quiere engañarte', p:['engan|estaf|aprovech|burla|mentir|trampa'], why:'…«más le gusta engañarte que los higos». Hay que decir que busca engañarte.'},
    {t:'El miedo al qué dirán nos hace callar / valor de decir la verdad', p:['miedo|que diran|honra|verdad|valor|atrever|presion|callar|opinion'], why:'Para el 10: el cuento también muestra que el miedo a la deshonra hace callar, y que hace falta valor para decir la verdad.'}
  ],
  modeloResumen:'Tres pícaros dijeron a un rey que sabían tejer un paño que solo podían ver quienes eran hijos de quien pasaba por ser su padre. El rey les dio oro, plata y seda y ellos fingieron tejer. Nadie veía la tela, pero todos, empezando por el rey, dijeron que era preciosa por miedo a perder la honra. En las fiestas el rey salió a caballo desnudo, y nadie decía nada, hasta que un palafrenero le dijo: «O yo soy ciego, o vais desnudo». Entonces todos reconocieron la verdad, pero los pícaros ya habían huido con lo robado.',
  modeloEnsenanza:'Enseña que debemos desconfiar de quien nos pide que ocultemos algo a nuestros amigos, porque quiere engañarnos. También muestra que el miedo al qué dirán nos hace callar ante una mentira, y que hace falta valor para decir la verdad.',
  preguntas:[
    {q:'¿Quiénes pueden ver el paño, según los pícaros?', o:[
      {t:'Solo los hijos de quien pasaba por ser su padre.', ok:1, why:'Exacto. Por eso nadie se atreve a decir que no lo ve: sería reconocer que no es hijo legítimo.'},
      {t:'Solo las personas inteligentes.', why:'Esa es la versión de Andersen («El traje nuevo del emperador»). En El conde Lucanor el paño lo ven los hijos legítimos.'},
      {t:'Solo los que tienen honra.', why:'Relacionado, pero no: la condición es ser hijo de quien pasa por su padre.'},
      {t:'Solo el rey.', why:'No. Los pícaros dicen que cualquier hijo legítimo puede verlo.'}]},
    {q:'¿Por qué le interesa al rey el paño al principio?', o:[
      {t:'Para descubrir quién no era hijo legítimo y quedarse con sus bienes.', ok:1, why:'Sí: entre los moros no heredaban los que no eran verdaderos hijos. La codicia del rey le hace caer.'},
      {t:'Para regalárselo a la reina.', why:'No se menciona a la reina.'},
      {t:'Para venderlo en el mercado.', why:'No. Quiere usarlo como detector de hijos ilegítimos.'},
      {t:'Porque tenía frío.', why:'¡Al contrario! El texto dice que por suerte era verano y no pasó frío.'}]},
    {q:'¿Quién se atreve a decir la verdad primero?', o:[
      {t:'Un palafrenero negro del rey, que «no tenía honra que perder».', ok:1, why:'Correcto. Una nota del libro explica que entonces la honra se veía como privilegio de la gente de alta posición.'},
      {t:'El gobernador.', why:'El gobernador también fingió ver la tela, incluso la alabó más que el rey.'},
      {t:'Un niño.', why:'El niño es de la versión de Andersen. Aquí es un palafrenero.'},
      {t:'El valido.', why:'Al valido «le ocurrió lo mismo»: fingió verla.'}]},
    {tf:1, q:'Los pícaros fueron castigados cuando se descubrió el engaño.', a:false, why:'Falso. Cuando fueron a buscarlos, ya habían huido con todo lo que habían estafado.'},
    {q:'¿Qué señal de alarma ve Patronio en la propuesta que le hacen al conde?', o:[
      {t:'Que le piden que no lo sepa nadie de su confianza.', ok:1, why:'Eso es. El secreto frente a los tuyos es la trampa.'},
      {t:'Que el negocio es demasiado caro.', why:'No se habla del precio. La clave es el secreto.'},
      {t:'Que le halagan mucho.', why:'Eso sería el exemplo V (la zorra y el cuervo).'},
      {t:'Que es un negocio basado en fantasías.', why:'Eso sería el exemplo VII (doña Truhana).'}]}
  ]
},
{
  id:'XXXIV', corto:'Los dos ciegos',
  titulo:'Lo que sucedió a un ciego que llevaba a otro',
  claves:'ciego|guia|barranco|pozos|limosna',
  problema:'Un familiar del conde, en quien confía totalmente y cuyo cariño es seguro, le aconseja ir a un lugar que le da miedo. Insiste en que no tema, porque antes perdería él la vida que consentir su daño.',
  personajes:['Un hombre que se quedó ciego','Otro ciego de la misma ciudad'],
  resumen:[
    'Un hombre perdió la vista y quedó ciego y pobre. Otro ciego de la misma ciudad le propuso ir juntos a una villa cercana para pedir limosna.',
    'El primero tenía miedo: sabía que el camino tenía pozos, barrancos profundos y puertos de montaña difíciles.',
    'El otro le insistió en que no temiera, que él le acompañaría y le guiaría seguro, y le contó tantas ventajas que al final lo convenció.',
    'Al llegar a los lugares más peligrosos, el ciego que guiaba cayó en un barranco, y con él cayó también el que había sospechado los peligros.'
  ],
  secuencia:[
    'Un hombre se queda ciego y pobre.',
    'Otro ciego le propone ir a otra villa a pedir limosna.',
    'El primero teme los pozos, barrancos y puertos de montaña.',
    'El segundo insiste en que él le guiará seguro y le convence.',
    'Los dos caen en un barranco.'
  ],
  consejo:'Patronio aconseja al conde que, si siente un recelo justificado y la aventura es peligrosa, no corra el riesgo aunque su pariente le diga que morirá él antes; porque de poco le servirá la muerte del pariente si él también muere.',
  moraleja:['Nunca te metas donde corras peligro','aunque te asista un verdadero amigo.'],
  hueco:{txt:'Nunca te metas donde corras ______ / aunque te asista un verdadero amigo.', ans:['peligro']},
  ensenanza:'No te metas en un peligro aunque te lo proponga alguien que te quiere y te asegura que te protegerá. Tener buena intención no significa saber o poder ayudarte. Si tu miedo tiene motivos, hazle caso.',
  ensenanzaCorta:'no hay que meterse en peligros aunque un amigo nos prometa protegernos',
  hoy:[
    '«Tranqui, yo controlo»: subirte al coche o a la moto con alguien que ha bebido, aunque sea tu mejor amigo.',
    'Retos virales peligrosos que te propone un amigo que dice que «no pasa nada».',
    'Pedir ayuda con los deberes a quien sabe lo mismo que tú: «un ciego guiando a otro ciego».'
  ],
  ojo:'Se inspira en una parábola de la Biblia: «Si un ciego guía a otro ciego, los dos caerán en el hoyo» (Mateo 15,14; Lucas 6,39), y en un cuadro famoso de Pieter Brueghel. Ojo: el que da el consejo en el caso del conde es un FAMILIAR suyo, de total confianza. La moraleja insiste en ello: «aunque te asista un verdadero amigo».',
  critica:'¿Significa que nunca hay que arriesgarse? El cuento habla de un recelo «justificado». Distingue entre miedo con motivos y miedo a salir de tu zona de confort.',
  ideasResumen:[
    {t:'Un hombre se queda ciego y pobre', p:['ciego|vista'], why:'Presenta al protagonista: un hombre que se quedó ciego y pobre.'},
    {t:'Otro ciego le propone viajar a otra villa (a pedir limosna)', p:['otro|segundo|propon|propus|villa|ciudad|limosna|viaj|camino'], why:'Falta la propuesta: otro ciego le invita a ir juntos a otra villa a pedir limosna.'},
    {t:'El primero tiene miedo por los peligros del camino', p:['miedo|tem|peligro|pozo|barranc|montan|recel'], why:'Importante: el primero teme el camino, con pozos, barrancos y montañas.'},
    {t:'El otro insiste en que le guiará seguro', p:['guia|guiar|insist|convenc|acompan|segur|proteg|llevar'], why:'El nudo: el segundo ciego insiste en que le guiará y le convence.'},
    {t:'Los dos caen en un barranco', p:['cae|cay|barranc|hoyo|los dos|ambos|mueren'], why:'El desenlace: los dos caen al barranco.'}
  ],
  ideasEnsenanza:[
    {t:'No meterse en peligros', p:['peligro|riesgo|arriesg|meterse|peligros'], why:'La moraleja: «Nunca te metas donde corras peligro».'},
    {t:'Aunque te lo proponga o te ayude un amigo / alguien de confianza', p:['amigo|familiar|pariente|confianza|quiere|aunque'], why:'…«aunque te asista un verdadero amigo». Esta parte es imprescindible.'},
    {t:'Hacer caso al miedo justificado / su ayuda no te salva', p:['miedo|recelo|intuicion|sospech|no sirve|no puede|tambien|los dos|no sabe'], why:'Para el 10: si tu recelo tiene motivos, hazle caso; la buena intención del amigo no te salvará si él tampoco puede.'}
  ],
  modeloResumen:'Un hombre se quedó ciego y pobre. Otro ciego le propuso ir juntos a otra villa a pedir limosna. El primero tenía miedo, porque sabía que el camino tenía pozos, barrancos y montañas, pero el otro le insistió en que le guiaría seguro y lo convenció. Al llegar a un lugar peligroso, el ciego que guiaba cayó en un barranco y arrastró con él al otro.',
  modeloEnsenanza:'Enseña que no debemos meternos en peligros aunque nos lo proponga un amigo que nos quiere y promete protegernos, porque su buena intención no nos salvará. Si nuestro miedo está justificado, hay que hacerle caso.',
  preguntas:[
    {q:'¿Quién aconseja al conde ir al lugar que le da miedo?', o:[
      {t:'Un familiar suyo en quien confía totalmente.', ok:1, why:'Sí: por eso el cuento es tan interesante; el consejo peligroso viene de alguien que le quiere.'},
      {t:'Un enemigo que quiere tenderle una trampa.', why:'No. La clave es que es alguien de total confianza, con buena intención.'},
      {t:'Patronio.', why:'Patronio es el consejero que le dice que NO vaya.'},
      {t:'Un desconocido que le pide secreto.', why:'Eso se parece al exemplo XXXII (el paño).'}]},
    {q:'¿Qué le pasa al final a los dos ciegos?', o:[
      {t:'Caen los dos en un barranco.', ok:1, why:'Correcto: el guía cae y arrastra al que ya sospechaba el peligro.'},
      {t:'Llegan a la villa y se hacen ricos.', why:'No llegan: caen por el camino.'},
      {t:'Solo cae el que guiaba.', why:'Caen los dos. Por eso Patronio dice que de poco sirve que el amigo muera antes si tú también mueres.'},
      {t:'Se pierden en el bosque.', why:'No hay bosque: hay pozos, barrancos y puertos de montaña.'}]},
    {tf:1, q:'El primer ciego no sospechaba nada del peligro del camino.', a:false, why:'Falso. Él sabía que había pozos, barrancos y puertos difíciles, pero se dejó convencer. ¡Tenía razón en su miedo!'},
    {tf:1, q:'Este cuento se inspira en una parábola de la Biblia.', a:true, why:'Verdadero: «Si un ciego guía a otro ciego, los dos caerán en el hoyo» (Mateo 15,14; Lucas 6,39).'}
  ]
},
{
  id:'XXXV', corto:'El mancebo que casó con mujer brava',
  titulo:'Lo que sucedió a un mancebo que casó con mujer brava',
  claves:'brava|perro|gato|caballo|agua para las manos|boda|casar|casó|suegro|gallo|novia',
  problema:'A un pariente del conde le quieren casar con una mujer muy rica y más ilustre que él, pero dicen que es muy violenta y colérica. El conde pregunta si debe aconsejarle que se case.',
  personajes:['Un mancebo (joven) bueno pero pobre','Su padre','Una joven de carácter muy violento («brava»)','El padre de ella (y su mujer)'],
  resumen:[
    'Un joven bueno y emprendedor, pero pobre, quería casarse bien para salir adelante. Pidió casarse con la hija de un hombre rico, una muchacha de carácter tan malo que nadie la quería por esposa. Su padre y el de ella le advirtieron que acabaría muerto, pero él insistió.',
    'La noche de bodas, al quedarse solos, antes de que ella pudiera hablar, el joven ordenó a un perro que le trajera agua para las manos. Como no lo hizo, lo persiguió y lo hizo pedazos con la espada. Hizo lo mismo con un gato y, finalmente, con su único caballo.',
    'Luego, lleno de sangre y furioso, ordenó a su mujer: «Levantaos y dadme agua para las manos». Ella, aterrada, obedeció al instante, y le sirvió en todo lo que pedía.',
    'Por la mañana, cuando las familias se acercaron temiendo lo peor, ella les mandó callar para no despertarle. Desde entonces fue obediente y «llevaron muy buena vida».',
    'El suegro quiso imitarle matando un gallo, pero su mujer le dijo: «Os decidís muy tarde… ahora nos conocemos de sobra».'
  ],
  secuencia:[
    'El joven pobre decide casarse con la muchacha rica de mal carácter.',
    'En la cena de bodas ordena a un perro que le traiga agua y lo mata.',
    'Hace lo mismo con un gato y con su único caballo.',
    'Ordena a su mujer que le traiga agua y ella obedece aterrada.',
    'Por la mañana, ella manda callar a las familias.',
    'El suegro intenta imitarle matando un gallo, pero ya es tarde.'
  ],
  consejo:'Patronio aconseja que, si el pariente tiene el carácter de aquel mancebo, se case, porque sabrá «mandar en su casa»; si no, que deje pasar la oportunidad. Y al conde le aconseja que, cuando trate con otros, les dé a entender desde el principio cómo tienen que comportarse con él.',
  moraleja:['Si desde un principio no muestras quién eres,','nunca podrás después, cuando quisieres.'],
  hueco:{txt:'Si desde un ______ no muestras quién eres, / nunca podrás después, cuando quisieres.', ans:['principio']},
  ensenanza:'La idea de fondo es que hay que mostrar desde el principio quién eres y cómo quieres que te traten, porque después es mucho más difícil cambiarlo. OJO: el método del cuento (violencia, miedo, sumisión de la mujer) es propio de la mentalidad medieval y hoy es inaceptable.',
  ensenanzaCorta:'hay que mostrar desde el principio quién eres, porque después no se puede',
  hoy:[
    'El primer día en un grupo, un equipo o un trabajo: deja claro con respeto qué aceptas y qué no. Poner límites desde el principio (sin violencia) es asertividad.',
    'Si al principio dejas que te traten mal («bueno, no pasa nada»), luego cuesta mucho cambiar esa dinámica.',
    'Una relación basada en el miedo y la obediencia, como la del cuento, es hoy violencia de género. Las relaciones sanas se basan en el respeto mutuo, no en «mandar».'
  ],
  ojo:'En el examen puedes resumirlo sin dramatizar, pero SIN omitir lo esencial: mata a un perro, un gato y su único caballo porque no le traen agua para las manos. El suegro mata un GALLO. La frase final de la suegra («ahora nos conocemos de sobra») explica la moraleja. Este cuento inspiró «La fierecilla domada» de Shakespeare.',
  critica:'Este es el cuento que MÁS criterio exige. Refleja una sociedad medieval en la que la mujer debía obedecer al marido y se aceptaba la violencia. Para sacar nota: explica la moraleja, reconoce que su método es hoy inaceptable (maltrato animal, violencia, miedo) y rescata lo válido: marcar límites desde el principio con respeto.',
  ideasResumen:[
    {t:'Un joven pobre se casa con una mujer rica de muy mal carácter', p:['brava|mal caracter|violent|coleric|mala|caracter|rica'], why:'Presenta la situación: un joven bueno y pobre se casa con una muchacha rica de carácter muy violento.'},
    {t:'Todos le advierten del peligro, pero él insiste', p:['advirt|avis|morir|nadie|insist|queria casarse|se casa|boda|casar|caso'], why:'Menciona la boda (y, si puedes, que todos le advierten que acabará mal).'},
    {t:'En la cena pide agua a un perro, un gato y un caballo y los mata', p:['perro|gato|caballo|animales|agua para las manos|mata|mato'], why:'El nudo: ordena a un perro, un gato y su caballo que le traigan agua para las manos y, como no obedecen, los mata.'},
    {t:'Se lo pide a la mujer y ella obedece por miedo', p:['obedec|miedo|asust|aterr|le trae|le trajo|ella (se|le)'], why:'El clímax: pide agua a su mujer y ella, aterrada, obedece.'},
    {t:'El suegro intenta imitarle (gallo) pero es tarde', p:['suegro|gallo|tarde|conocemos|padre de ella|imitar'], why:'Para el 10: el final del suegro con el gallo y la respuesta «os decidís muy tarde» explica la moraleja.'}
  ],
  ideasEnsenanza:[
    {t:'Mostrar desde el principio quién eres', p:['principio|inicio|desde el comienzo|primer momento|desde el primer|al empezar|desde un principio'], why:'La moraleja: «Si desde un principio no muestras quién eres…».'},
    {t:'Después ya no se puede cambiar', p:['despues|luego|tarde|no podras|no se puede|cuesta|dificil'], why:'…«nunca podrás después, cuando quisieres».'},
    {t:'Hoy: poner límites con respeto; la violencia del cuento es inaceptable', p:['limite|respeto|asertiv|violencia|maltrato|machis|epoca|edad media|inaceptable|hoy|mentalidad'], why:'Para el 10: demuestra criterio. Di que hoy se aplica marcando límites con respeto y que la violencia y la sumisión del cuento son inaceptables.'}
  ],
  modeloResumen:'Un joven bueno pero pobre se casó con una muchacha rica de carácter muy violento, aunque todos le advirtieron del peligro. En la cena de bodas ordenó a un perro, a un gato y a su caballo que le trajeran agua para las manos y, como no obedecieron, los mató. Después se lo ordenó a su mujer, que, aterrada, obedeció. Desde entonces ella fue obediente. Su suegro quiso hacer lo mismo matando un gallo, pero su mujer le dijo que ya era tarde, porque ya se conocían.',
  modeloEnsenanza:'Enseña que hay que mostrar desde el principio quién eres y cómo quieres que te traten, porque después es muy difícil cambiarlo. Hoy lo aplicaríamos poniendo límites con respeto, ya que la violencia y la sumisión de la mujer que muestra el cuento son inaceptables.',
  preguntas:[
    {q:'¿Qué ordena el mancebo a los animales?', o:[
      {t:'Que le traigan agua para las manos.', ok:1, why:'Sí. Una orden imposible a propósito: no quiere agua, quiere dar miedo.'},
      {t:'Que se callen.', why:'No. Pide agua para las manos.'},
      {t:'Que le sirvan la cena.', why:'La cena se la pide luego a la mujer. A los animales les pide agua.'},
      {t:'Que se vayan de la casa.', why:'No. La orden es traer agua para las manos.'}]},
    {q:'¿Qué animal mata el suegro para imitar a su yerno?', o:[
      {t:'Un gallo.', ok:1, why:'Correcto. Y su mujer le responde que ya es tarde: «ahora nos conocemos de sobra».'},
      {t:'Un perro.', why:'El perro es el primer animal que mata el YERNO.'},
      {t:'Un caballo.', why:'El caballo (el único que tenía) lo mata el yerno.'},
      {t:'Un gato.', why:'El gato también lo mata el yerno.'}]},
    {tf:1, q:'Patronio aconseja que el pariente se case solo si tiene el carácter de aquel mancebo.', a:true, why:'Verdadero. «Si no es así… debe dejar pasar esa oportunidad».'},
    {q:'Desde una mirada actual, ¿cuál es la valoración MÁS acertada del cuento?', o:[
      {t:'La moraleja (mostrar desde el principio quién eres) puede ser útil, pero el método violento y la sumisión de la mujer son inaceptables hoy.', ok:1, why:'Eso es tener criterio: separar la idea útil del contexto medieval que la envuelve.'},
      {t:'Es un buen modelo de pareja: el marido debe mandar en casa.', why:'No. Es la mentalidad del siglo XIV. Hoy una relación basada en el miedo es violencia de género.'},
      {t:'Es un cuento que no enseña nada y no hay que estudiarlo.', why:'Sí enseña algo (la importancia de los comienzos) y además sirve para ver cómo pensaba la sociedad medieval.'},
      {t:'La mujer es la villana y merece lo que le pasa.', why:'Esa lectura justifica la violencia. Un buen análisis crítico reconoce el contexto y no lo aplaude.'}]}
  ]
},
{
  id:'XXXVIII', corto:'El hombre de las piedras preciosas',
  titulo:'Lo que sucedió a un hombre que iba cargado con piedras preciosas y se ahogó en el río',
  claves:'piedras preciosas|piedras|rio|ahog|tesoro|hundi|carga',
  problema:'El conde desea quedarse en una villa donde le darán mucho dinero, con el que espera grandes beneficios, pero teme que, si se queda, su vida corra peligro.',
  personajes:['Un hombre cargado de piedras preciosas','Un hombre en la orilla del río'],
  resumen:[
    'Un hombre llevaba a cuestas una gran cantidad de piedras preciosas que pesaban mucho.',
    'Tuvo que cruzar un río y, por el peso, se hundía cada vez más, sobre todo en la parte más honda.',
    'Un hombre desde la orilla le gritaba que soltara la carga o se ahogaría.',
    'Pero, por codicia, pensando en lo que valían las piedras, no quiso soltarlas. Murió ahogado y perdió la vida y el tesoro.'
  ],
  secuencia:[
    'Un hombre lleva a cuestas muchas piedras preciosas.',
    'Al cruzar un río se hunde por el peso.',
    'Un hombre en la orilla le grita que suelte la carga.',
    'Por codicia no las suelta.',
    'Muere ahogado y pierde la vida y el tesoro.'
  ],
  consejo:'Patronio aconseja al conde que no se quede donde peligra su vida por conseguir dinero. Solo se debe arriesgar la vida por un asunto de honra o para evitar un daño grave. Quien se estima en poco arriesga la vida por codicia; quien vale mucho se valora en su justo precio y solo la arriesga cuando de verdad merece la pena.',
  moraleja:['A quien por codicia su vida aventura,','sabed que sus bienes muy poco le duran.'],
  hueco:{txt:'A quien por ______ su vida aventura, / sabed que sus bienes muy poco le duran.', ans:['codicia']},
  ensenanza:'La vida vale más que cualquier riqueza. La codicia nos puede hacer perderlo todo: el dinero y la vida. Hay que saber soltar a tiempo.',
  ensenanzaCorta:'no hay que arriesgar la vida por codicia, porque se pierde todo',
  hoy:[
    'Hacerse un selfie peligroso o un reto viral por conseguir «likes».',
    'Volver a por la mochila o el móvil en un incendio o una inundación.',
    'Trabajar sin descanso ni dormir por ganar más dinero hasta enfermar: el tesoro no sirve de nada sin salud.'
  ],
  ojo:'No lo confundas con el XXXIV (los ciegos): allí el peligro viene de fiarse de un amigo; aquí viene de la CODICIA. Detalle: sí hay un hombre en la orilla que le avisa; el protagonista no le hace caso. Patronio sí admite arriesgar la vida por honra o para evitar un daño grave.',
  critica:'Patronio dice que el que «se estima en poco» es quien arriesga la vida por dinero. ¿Qué relación ves entre autoestima y codicia?',
  ideasResumen:[
    {t:'Un hombre carga muchas piedras preciosas', p:['piedras|preciosas|tesoro|joyas|riquezas|carga'], why:'Presenta al protagonista y su carga: muchas piedras preciosas que pesan mucho.'},
    {t:'Cruza un río y se hunde por el peso', p:['rio|agua|cruz|hund|peso|pesa'], why:'El problema: al cruzar un río, el peso le hunde.'},
    {t:'Alguien le avisa de que suelte la carga', p:['orilla|avis|grit|voces|le dice|le decia|solt|abandon|dejar'], why:'Un hombre desde la orilla le avisa de que suelte las piedras.'},
    {t:'Por codicia no las suelta', p:['codici|avar|no quiso|no quiere|no las suelta|no solto|valor|valian'], why:'Clave: por codicia no quiere soltarlas.'},
    {t:'Muere ahogado y lo pierde todo', p:['ahog|muer|muri|pierde|perdio|todo'], why:'El desenlace: muere ahogado y pierde la vida y el tesoro.'}
  ],
  ideasEnsenanza:[
    {t:'No arriesgar la vida', p:['vida|arriesg|aventur|peligro|morir'], why:'La moraleja habla de quien «su vida aventura», es decir, la pone en peligro.'},
    {t:'Por codicia / dinero', p:['codici|dinero|riqueza|avar|bienes|ambici|tesoro'], why:'…«por codicia». Hay que nombrar la causa.'},
    {t:'Se pierde todo / la vida vale más', p:['pierde|perder|poco le duran|todo|vale mas|mas importante|no sirve'], why:'Para el 10: quien lo hace pierde los bienes (y la vida); la vida vale más que el dinero.'}
  ],
  modeloResumen:'Un hombre llevaba a cuestas muchas piedras preciosas. Al cruzar un río, el peso le hacía hundirse. Un hombre desde la orilla le gritó que soltara la carga para no ahogarse, pero él, por codicia, no quiso desprenderse de las piedras. Murió ahogado y perdió la vida y el tesoro.',
  modeloEnsenanza:'Enseña que no hay que arriesgar la vida por codicia, porque quien lo hace acaba perdiendo la vida y también sus bienes. La vida vale más que cualquier riqueza.',
  preguntas:[
    {q:'¿Por qué el hombre no suelta las piedras?', o:[
      {t:'Por codicia: pensaba en cuánto valían.', ok:1, why:'Exacto. La codicia le ciega.'},
      {t:'Porque no oía al hombre de la orilla.', why:'El texto dice que «no comprendió» que perdería vida y tesoro, pero la causa es la codicia.'},
      {t:'Porque estaban atadas y no podía.', why:'No se dice. Él «no quiso» desprenderse de ellas.'},
      {t:'Porque eran de su señor y debía entregarlas.', why:'No aparece ningún señor.'}]},
    {q:'¿Cuándo sí se puede arriesgar la vida, según Patronio?', o:[
      {t:'En asuntos de honra o si no hacerlo causaría un daño grave.', ok:1, why:'Correcto. No es un «nunca arriesgues»: es no arriesgarla por codicia o por poca cosa.'},
      {t:'Nunca, bajo ninguna circunstancia.', why:'No. Patronio admite excepciones: la honra o evitar un daño grave.'},
      {t:'Cuando la ganancia es muy grande.', why:'¡Justo lo contrario! Eso es la codicia que critica.'},
      {t:'Cuando un amigo te lo pide.', why:'Eso lo desaconseja el exemplo XXXIV (los ciegos).'}]},
    {tf:1, q:'Nadie avisó al hombre del peligro.', a:false, why:'Falso. Un hombre desde la orilla le gritaba que soltara la carga. Él no hizo caso.'},
    {tf:1, q:'Según Patronio, quien se valora en su justo valor no arriesga la vida por cosas pequeñas.', a:true, why:'Verdadero. Quien «se estima en poco» es el que la arriesga por codicia.'}
  ]
},
{
  id:'XLII', corto:'El diablo y la falsa devota',
  titulo:'Lo que sucedió al diablo con una falsa devota',
  claves:'diablo|demonio|beguina|devota|navaja|barba|matrimonio|calumni|degoll',
  problema:'El conde y sus amigos discuten cómo puede un hombre muy perverso causar más daño: ¿encabezando revueltas, peleando contra todos, cometiendo crímenes o calumniando y difamando?',
  personajes:['Un matrimonio joven y feliz','El diablo','Una beguina (falsa devota)','Las familias de los esposos'],
  resumen:[
    'Un matrimonio joven se llevaba muy bien. El diablo intentó durante mucho tiempo meter cizaña entre ellos, sin conseguirlo. Triste, se encontró con una beguina (una mujer que aparentaba ser muy religiosa), que se ofreció a lograrlo.',
    'La beguina se ganó la confianza de la esposa diciéndole que la había educado su madre y se instaló en la casa. Luego le dijo a la esposa que su marido amaba a otra, y al marido que su mujer lo sabía y buscaría a otro hombre. A cada uno le decía que el otro estaba enfadado.',
    'Después convenció a la esposa de que un mago haría un remedio con unos pelos de la barba del marido, cerca de la garganta, y le dio una navaja para cortarlos mientras él dormía en su regazo. Al marido le dijo que su mujer y su amante planeaban degollarle así.',
    'El marido fingió dormir, vio a su mujer con la navaja junto a su cuello y, creyendo la calumnia, la mató. La familia de ella mató al marido, y la de él se vengó: murieron casi todos los habitantes de la villa.',
    'Al final se supo que todo fue por las calumnias de la falsa devota, a la que torturaron hasta la muerte.'
  ],
  secuencia:[
    'El diablo no consigue separar a un matrimonio feliz.',
    'Una beguina se ofrece a ayudarle y se gana la confianza de la esposa.',
    'Dice a cada esposo que el otro le engaña o está enfadado.',
    'Da a la esposa una navaja para cortar pelos de la barba del marido.',
    'Dice al marido que su mujer quiere degollarle; él la mata.',
    'Las familias se matan entre sí y la beguina es castigada.'
  ],
  consejo:'Patronio responde que el peor hombre del mundo es el que finge ser buen cristiano, honrado y leal, pero tiene el corazón falso y se dedica a sembrar calumnias que enemistan a las personas. Aconseja evitar a los hipócritas y reconocerlos por sus obras: «A fructibus eorum cognoscetis eos» («Por sus obras los conoceréis»). Nadie puede ocultar para siempre sus secretos.',
  moraleja:['Si deseas evitar tan grandes desventuras','no te dejes convencer por las falsas criaturas.'],
  hueco:{txt:'Si deseas evitar tan grandes desventuras / no te dejes convencer por las ______ criaturas.', ans:['falsas']},
  ensenanza:'La calumnia y la hipocresía son lo que más daño hace: pueden destruir incluso lo que el diablo no pudo. Desconfía de quien siembra chismes y enfrenta a las personas, aunque parezca muy buena persona; júzgala por sus obras.',
  ensenanzaCorta:'la calumnia de los hipócritas es lo más dañino; hay que juzgar a la gente por sus obras',
  hoy:[
    'Chismes en el grupo de WhatsApp: «me han dicho que ha dicho que…». Antes de creerlo, habla directamente con la persona.',
    'Ciberacoso y difamación: un rumor falso puede destrozar la vida de alguien.',
    'Si los esposos hubieran hablado entre ellos, nada habría pasado: la comunicación directa desactiva la calumnia.'
  ],
  ojo:'En el índice del PDF aparece como «XLIII», pero en el texto el título es EXEMPLO XLII (la numeración correcta). La mala es una «beguina»: mujeres que vivían como religiosas sin serlo y que acabaron teniendo mala fama. Detalle clave: la navaja y los pelos de la barba «cerca de la garganta».',
  critica:'Fíjate en la ironía: el DIABLO fracasa y una persona que parece piadosa lo consigue. ¿Qué dice el autor sobre las apariencias y la hipocresía religiosa de su época?',
  ideasResumen:[
    {t:'El diablo no consigue separar a un matrimonio feliz', p:['diablo|demonio'], why:'Empieza por el diablo, que no logra separar a un matrimonio que se lleva muy bien.'},
    {t:'Una falsa devota (beguina) le ayuda', p:['beguina|devota|mujer|vieja|falsa'], why:'Presenta a la falsa devota (beguina) que se ofrece a ayudar al diablo.'},
    {t:'Engaña a cada esposo con mentiras sobre el otro', p:['mient|calumni|engan|dice (a la|al)|otra mujer|amante|enfad|celos|sospech|cizana'], why:'El nudo: siembra calumnias, diciendo a cada esposo que el otro le engaña o está enfadado.'},
    {t:'La navaja: ella va a cortarle la barba y él cree que quiere matarle', p:['navaja|barba|pelos|degoll|cuello|garganta'], why:'La trampa final: la navaja para cortar pelos de la barba, que el marido interpreta como intento de degollarle.'},
    {t:'El marido la mata y las familias se matan entre sí', p:['mata|mato|muer|muri|venganza|famil|villa|todos'], why:'El desenlace: el marido mata a su mujer, las familias se vengan y muere casi toda la villa. La beguina es castigada.'}
  ],
  ideasEnsenanza:[
    {t:'La calumnia / los chismes causan el mayor daño', p:['calumni|chism|difam|mentir|rumor|mentiras|enemist'], why:'Respuesta a la pregunta del conde: lo que más daño hace es la calumnia.'},
    {t:'Desconfiar de los hipócritas / falsas criaturas', p:['hipocr|falso|falsa|apariencia|parece|finge|fingen|no te dejes convencer'], why:'La moraleja: «no te dejes convencer por las falsas criaturas».'},
    {t:'Se les conoce por sus obras / la verdad sale a la luz', p:['obras|hechos|actos|frutos|conoceras|conocereis|sale a la luz|se descubre|hablar|comunic'], why:'Para el 10: «Por sus obras los conoceréis»; nadie oculta para siempre sus secretos.'}
  ],
  modeloResumen:'El diablo no conseguía separar a un matrimonio que se llevaba muy bien, y una falsa devota se ofreció a ayudarle. Se ganó la confianza de la esposa y empezó a decir a cada uno que el otro le engañaba. Luego dio a la mujer una navaja para cortar unos pelos de la barba de su marido mientras dormía, y al marido le dijo que su mujer quería degollarle. Cuando él la vio con la navaja junto a su cuello, la mató. Las familias se vengaron y murieron casi todos en la villa. Al final se descubrió la calumnia y la falsa devota fue castigada.',
  modeloEnsenanza:'Enseña que la calumnia es lo que más daño hace y que debemos desconfiar de los hipócritas que aparentan ser buenos pero siembran mentiras. A las personas hay que juzgarlas por sus obras.',
  preguntas:[
    {q:'¿Qué conclusión saca Patronio sobre cómo se causa más daño?', o:[
      {t:'Con calumnias, fingiendo ser buena persona.', ok:1, why:'Sí. La hipocresía unida a la calumnia supera incluso al diablo.'},
      {t:'Encabezando revueltas.', why:'Es una de las opciones que discutían el conde y sus amigos, pero Patronio elige la calumnia.'},
      {t:'Peleando contra todos.', why:'Otra opción de la tertulia, pero no es la respuesta de Patronio.'},
      {t:'Cometiendo crímenes con las propias manos.', why:'La beguina no mata a nadie con sus manos y, aun así, provoca decenas de muertes.'}]},
    {q:'¿Para qué le da la beguina una navaja a la esposa?', o:[
      {t:'Para cortar unos pelos de la barba del marido para un supuesto remedio mágico.', ok:1, why:'Correcto: la trampa perfecta, porque el marido cree que va a degollarle.'},
      {t:'Para que se defienda del marido.', why:'No. Le dice que es para un remedio de un mago.'},
      {t:'Para matar al diablo.', why:'No. La esposa ni sabe que el diablo está detrás.'},
      {t:'Para cortar el pan de la cena.', why:'No. Son los pelos «de los que nacen cerca de la garganta».'}]},
    {tf:1, q:'El diablo consigue él solo separar al matrimonio.', a:false, why:'Falso. Fracasa durante mucho tiempo. Lo consigue la falsa devota: ¡la calumnia es peor que el diablo!'},
    {q:'¿Qué significa «A fructibus eorum cognoscetis eos»?', o:[
      {t:'«Por sus obras (frutos) los conoceréis».', ok:1, why:'Correcto. Viene del Evangelio de san Mateo (7,16).'},
      {t:'«Evitad la mentira y abrazad la verdad».', why:'Esa es la moraleja del árbol de la Mentira (XXVI).'},
      {t:'«No hay mejor amigo que Dios».', why:'Esa idea es del exemplo XLVIII.'},
      {t:'«El diablo sabe más por viejo».', why:'Refrán popular, pero no es eso.'}]}
  ]
},
{
  id:'XLVIII', corto:'El amigo y medio',
  titulo:'Lo que sucedió a uno que probaba a sus amigos',
  claves:'cerdo|saco|coles|huerta|medio amigo|amigo y medio|bofetada|amigos',
  problema:'El conde cree tener muchos amigos que le prometen arriesgar vida y hacienda por él. Quiere saber cómo comprobar si harán lo que dicen.',
  personajes:['Un hombre honrado (el padre)','Su hijo, que presume de muchos amigos','Los amigos del hijo','El «medio amigo» del padre','El amigo «entero» (cabal) del padre y su hijo'],
  resumen:[
    'Un padre aconsejaba a su hijo tener buenos amigos. El hijo presumía de tener muchos, y diez que nunca le abandonarían. El padre, anciano, decía que él solo tenía «un amigo y medio».',
    'Para probarlos, el padre le mandó matar un cerdo, meterlo en un saco y decir a sus amigos que era un hombre al que había matado, pidiéndoles que le ayudaran a esconderlo. Todos se negaron; como mucho le prometieron pedir clemencia o enterrarle con solemnidad si le ejecutaban.',
    'El «medio amigo» del padre, aunque no tenía trato con el joven, lo ayudó por aprecio al padre: enterró el saco en su huerta bajo un surco de coles. Luego el joven, por orden de su padre, le dio una bofetada en público, y aun así el hombre le dijo que nunca descubriría «las coles de la huerta».',
    'Por último probó al amigo «entero» del padre. Por casualidad había aparecido un hombre asesinado en la ciudad y culparon al joven. El amigo, para salvarle, declaró que el asesino era su único hijo, que se declaró culpable y fue ejecutado en su lugar.',
    'Patronio añade una interpretación espiritual: los amigos del mundo nos abandonan ante la muerte, los santos son como «medio amigos» y Dios es el amigo verdadero, que entregó a su Hijo por nosotros.'
  ],
  secuencia:[
    'El hijo presume de muchos amigos; el padre solo tiene un amigo y medio.',
    'El hijo mata un cerdo, lo mete en un saco y dice que es un hombre muerto.',
    'Todos los amigos del hijo se niegan a ayudarle.',
    'El medio amigo lo entierra en la huerta bajo las coles.',
    'Tras recibir una bofetada en público, el medio amigo sigue guardando el secreto.',
    'El amigo entero entrega a su propio hijo para salvar al joven.'
  ],
  consejo:'Patronio dice al conde que así se prueba a los amigos: hay algunos verdaderos, pero muchos más que solo lo son en la prosperidad y desaparecen en la desgracia. Además, el mejor amigo es Dios.',
  moraleja:['No hay mejor amigo que Nuestro Señor','que, por redimirnos, su vida entregó.'],
  hueco:{txt:'No hay mejor ______ que Nuestro Señor / que, por redimirnos, su vida entregó.', ans:['amigo']},
  ensenanza:'Los amigos de verdad se conocen en los momentos difíciles: muchos lo son solo cuando todo va bien. Hay que valorar a los pocos amigos verdaderos. En su sentido religioso, el mejor amigo es Dios, que dio su vida por nosotros.',
