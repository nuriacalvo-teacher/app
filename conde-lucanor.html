<script>
/* =========================================================
   MOTOR DE LA APP
   ========================================================= */
const byId = Object.fromEntries(CUENTOS.map(c => [c.id, c]));
const IDS = CUENTOS.map(c => c.id);
const app = document.getElementById('app');

/* ---------- utilidades ---------- */
const esc = s => String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a, n) => shuffle(a).slice(0, n);
const rand = a => a[Math.floor(Math.random() * a.length)];
const words = s => (s.trim().match(/\S+/g) || []).length;
const lev = (a, b) => { const m = a.length, n = b.length, d = Array.from({length: m + 1}, (_, i) => [i, ...Array(n).fill(0)]); for (let j = 1; j <= n; j++) d[0][j] = j; for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1)); return d[m][n]; };
const fmt = n => (Math.round(n * 10) / 10).toString().replace('.', ',');
const cName = id => `«${byId[id].corto}» (${id})`;

const PRAISE = ['¡Bien visto!', '¡Exacto!', '¡Eso es!', '¡Patronio estaría orgulloso!', '¡Muy bien!', '¡Correcto!', '¡Así se hace!'];
const OOPS = ['¡Uy! Aquí te has liado.', 'Casi, pero no.', 'Ojo, que esta tenía trampa.', 'No pasa nada: de los errores se aprende.', 'Vamos a verlo con calma.'];

/* ---------- memoria del alumno (solo en este navegador) ---------- */
let store = {};
try { store = JSON.parse(localStorage.getItem('lucanor.v1')) || {}; } catch (e) { store = {}; }
store.stats = store.stats || {}; store.fallos = store.fallos || []; store.vistos = store.vistos || {}; store.examenes = store.examenes || [];
function save() { try { localStorage.setItem('lucanor.v1', JSON.stringify(store)); } catch (e) {} }
function record(item, frac) {
  if (item.cid) { const s = store.stats[item.cid] || {ok: 0, tot: 0}; s.ok += frac; s.tot += 1; store.stats[item.cid] = s; }
  if (item.key) {
    const i = store.fallos.indexOf(item.key);
    if (frac < 0.7 && i < 0) store.fallos.push(item.key);
    if (frac >= 0.7 && i >= 0) store.fallos.splice(i, 1);
  }
  save();
}
function mastery(id) { const s = store.stats[id]; return s && s.tot ? s.ok / s.tot : null; }
function barClass(m) { return m === null ? '' : m >= 0.8 ? '' : m >= 0.5 ? 'mid' : 'low'; }

/* ---------- navegación ---------- */
let current = 'inicio';
function go(view, arg) {

/* =========================================================
   GENERADORES DE PREGUNTAS
   Cada pregunta tiene una "clave" para poder repetirla en el repaso de fallos.
   ========================================================= */
function othersOf(id, n) { return pick(IDS.filter(x => x !== id), n); }
function buildKey(k) {
  const [t, a] = k.split(':');
  const c = byId[a];
  switch (t) {
    case 'b': { const [, id, idx] = k.split(':'); const p = byId[id].preguntas[+idx];
      return p.tf ? {type: 'tf', key: k, cid: id, q: p.q, a: p.a, why: p.why} : {type: 'mc', key: k, cid: id, q: p.q, opts: shuffle(p.o)}; }
    case 'l': { const p = LIBRO[+a];
      return p.tf ? {type: 'tf', key: k, tag: 'El libro', q: p.q, a: p.a, why: p.why} : {type: 'mc', key: k, tag: 'El libro', q: p.q, opts: shuffle(p.o)}; }
    case 's': { const s = SITUACIONES[+a];
      return {type: 'mc', key: k, cid: s.c, tag: 'Aplícalo a hoy', hideCid: 1, q: s.s, sub: '¿Qué exemplo le serviría de consejo?',
        opts: shuffle([s.c, ...othersOf(s.c, 3)].map(id => id === s.c ? {t: cName(id), ok: 1, why: s.why}
          : {t: cName(id), why: `Ese cuento enseña que ${byId[id].ensenanzaCorta}. Aquí no encaja: ${s.why}`}))}; }
    case 'mo':
      return {type: 'mc', key: k, cid: a, tag: 'Moraleja', hideCid: 1, q: '¿De qué cuento es esta moraleja?', cita: c.moraleja.join(' / '),
        opts: shuffle([a, ...othersOf(a, 3)].map(id => id === a ? {t: cName(id), ok: 1, why: `Sí: ${c.ensenanza}`}
          : {t: cName(id), why: `No. «${byId[id].corto}» enseña que ${byId[id].ensenanzaCorta}, y su moraleja es: «${byId[id].moraleja.join(' ')}».`}))};
    case 'pr':
      return {type: 'mc', key: k, cid: a, tag: 'El problema del conde', hideCid: 1, q: 'El conde le plantea a Patronio este problema. ¿Qué cuento le cuenta Patronio?', cita: c.problema,
        opts: shuffle([a, ...othersOf(a, 3)].map(id => id === a ? {t: cName(id), ok: 1, why: `Correcto. Patronio le aconseja: ${c.consejo}`}
          : {t: cName(id), why: `En «${byId[id].corto}» el problema era otro: ${byId[id].problema}`}))};
    case 'en':
      return {type: 'mc', key: k, cid: a, tag: 'Enseñanza', hideCid: 1, q: `¿Qué cuento enseña que ${c.ensenanzaCorta}?`,
        opts: shuffle([a, ...othersOf(a, 3)].map(id => id === a ? {t: cName(id), ok: 1, why: c.ensenanza}
          : {t: cName(id), why: `No: «${byId[id].corto}» enseña que ${byId[id].ensenanzaCorta}.`}))};
    case 'g':
      return {type: 'gap', key: k, cid: a, tag: 'Completa el verso', q: `Completa la moraleja de «${c.corto}» (${a}):`, txt: c.hueco.txt, ans: c.hueco.ans, full: c.moraleja.join(' / ')};
    case 'o':
      return {type: 'order', key: k, cid: a, tag: 'Ordena la historia', q: `Ordena los hechos de «${c.corto}» (${a}):`, items: c.secuencia};
    case 'wr':
      return {type: 'write', key: k, cid: a, kind: 'resumen', tag: 'Escribe', q: `Resume el cuento «${c.corto}» (exemplo ${a}).`, ideas: c.ideasResumen, modelo: c.modeloResumen, min: 45};
    case 'we':
      return {type: 'write', key: k, cid: a, kind: 'enseñanza', tag: 'Escribe', q: `¿Qué enseña el cuento «${c.corto}» (exemplo ${a})?`, ideas: c.ideasEnsenanza, modelo: c.modeloEnsenanza, min: 14};
    case 'rf': { const r = REFLEXION[+a];
      return {type: 'write', key: k, cid: r.c, kind: 'reflexión', tag: 'Piensa y opina', q: r.q, ideas: r.ideas, modelo: null, min: 35}; }
    case 'mm': {
      const ids = pick(IDS, 5);
      return {type: 'match', tag: 'Relaciona', q: 'Relaciona cada moraleja con su cuento.', rows: ids.map(id => ({l: byId[id].moraleja.join(' / '), id})), choices: shuffle(ids)}; }
  }
}
const bankKeys = id => byId[id].preguntas.map((_, i) => `b:${id}:${i}`);
const allObjectiveKeys = () => [
  ...IDS.flatMap(bankKeys), ...LIBRO.map((_, i) => 'l:' + i), ...SITUACIONES.map((_, i) => 's:' + i),
  ...IDS.flatMap(id => ['mo:' + id, 'pr:' + id, 'en:' + id])
];

function startCuento(id) {
  const keys = [...shuffle(bankKeys(id)), 'pr:' + id, 'g:' + id, 'o:' + id, 'we:' + id, 'wr:' + id];
  runQuiz({title: `Exemplo ${id} · ${byId[id].corto}`, items: keys.map(buildKey)});
}
function startMezcla() { runQuiz({title: 'Mezcla rápida', items: pick(allObjectiveKeys(), 8).concat(['g:' + rand(IDS), 'o:' + rand(IDS)]).map(buildKey)}); }
function startSituaciones() { runQuiz({title: '¿Qué cuento te aconsejaría?', items: pick(SITUACIONES.map((_, i) => 's:' + i), 10).map(buildKey)}); }
function startMoralejas() { runQuiz({title: 'Versos y moralejas', items: [buildKey('mm'), ...pick(IDS, 5).map(id => buildKey('g:' + id)), buildKey('mm'), ...pick(IDS, 3).map(id => buildKey('mo:' + id))]}); }
function startOrden() { runQuiz({title: 'Ordena la historia', items: pick(IDS, 6).map(id => buildKey('o:' + id))}); }
function startLibro() { runQuiz({title: 'El libro y su estructura', items: shuffle(LIBRO.map((_, i) => 'l:' + i)).map(buildKey)}); }
function startFallos() {
  if (!store.fallos.length) { go('practicar'); return; }
  runQuiz({title: 'Repaso de mis fallos', items: shuffle(store.fallos).slice(0, 15).map(buildKey).filter(Boolean)});
}

/* =========================================================
   CORRECCIÓN
   ========================================================= */
function tagHTML(item) {
  const tipo = {mc: 'Elige la respuesta', tf: 'Verdadero o falso', gap: 'Completa', order: 'Ordena', match: 'Relaciona', write: 'Respuesta escrita'}[item.type];
  const cid = item.hideCid ? null : item.cid;
  return `<div class="qtag"><span class="t1">${cid ? 'Exemplo ' + cid : esc(item.tag || 'Los 15 cuentos')}</span><span class="t2">· ${item.tag && cid ? esc(item.tag) : tipo}</span></div>`;
}
function fichaLink(cid) { return cid ? `<div><button class="btn sm" data-ficha="${cid}" type="button">Repasar la ficha de «${esc(byId[cid].corto)}»</button></div>` : ''; }

function checkMC(item, sel) {
  const o = item.opts[sel], ok = item.opts.find(x => x.ok);
  if (o.ok) return {frac: 1, html: `<div class="fb ok"><p class="ttl">${rand(PRAISE)}</p><p>${esc(o.why)}</p></div>`};
  return {frac: 0, html: `<div class="fb bad"><p class="ttl">${rand(OOPS)}</p>
    <p><b>Has elegido:</b> «${esc(o.t)}». ${esc(o.why)}</p>
    <p class="fix"><b>La correcta es:</b> «${esc(ok.t)}». ${esc(ok.why)}</p>${fichaLink(item.cid)}</div>`};
}
function checkTF(item, v) {
  const good = v === item.a;
  if (good) return {frac: 1, html: `<div class="fb ok"><p class="ttl">${rand(PRAISE)}</p><p>${esc(item.why)}</p></div>`};
  return {frac: 0, html: `<div class="fb bad"><p class="ttl">${rand(OOPS)}</p>
    <p>Has dicho <b>${v ? 'Verdadero' : 'Falso'}</b>, pero es <b>${item.a ? 'Verdadero' : 'Falso'}</b>.</p>
    <p class="fix">${esc(item.why)}</p>
    <p class="tip">Truco: en las de verdadero o falso, busca la palabra que lo cambia todo (quién lo hace, qué objeto, «siempre», «nunca», «solo»…).</p>${fichaLink(item.cid)}</div>`};
}
function checkGap(item, val) {
  const v = norm(val), best = item.ans.map(a => [a, lev(v, norm(a))]).sort((x, y) => x[1] - y[1])[0];
  if (best[1] === 0) return {frac: 1, html: `<div class="fb ok"><p class="ttl">${rand(PRAISE)}</p><p class="verso" style="font-size:1.15rem">${esc(item.full)}</p></div>`};
  if (best[1] === 1 && best[0].length >= 4) return {frac: 1, html: `<div class="fb mid"><p class="ttl">¡Bien, aunque revisa la ortografía!</p><p>Has escrito «${esc(val)}» y es «<b>${esc(best[0])}</b>». Te lo doy por bueno, pero en el examen cuidado.</p><p class="verso" style="font-size:1.15rem">${esc(item.full)}</p></div>`};
  const otro = CUENTOS.find(c => c.id !== item.cid && c.hueco.ans.some(a => norm(a) === v));
  return {frac: 0, html: `<div class="fb bad"><p class="ttl">${rand(OOPS)}</p>
    <p>${v ? `Has escrito «${esc(val)}».` : 'Lo has dejado en blanco.'} La palabra que falta es «<b>${esc(item.ans[0])}</b>».${otro ? ` Esa palabra es la que falta en la moraleja de «${esc(otro.corto)}»: ¡no mezcles los versos!` : ''}</p>
    <p class="verso" style="font-size:1.15rem">${esc(item.full)}</p>
    <p class="tip">Para memorizarla: la moraleja resume la enseñanza. Aquí: ${esc(byId[item.cid].ensenanzaCorta)}.</p></div>`};
}
function checkOrder(item, order) {
  let good = 0; order.forEach((txt, i) => { if (txt === item.items[i]) good++; });
  const frac = good / item.items.length;
  const list = `<ol class="orden">${item.items.map((t, i) => `<li class="${order[i] === t ? 'is-ok' : 'is-bad'}"><span class="n">${i + 1}</span><span>${esc(t)}</span><span>${order[i] === t ? '✓' : '✗'}</span></li>`).join('')}</ol>`;
  if (frac === 1) return {frac, html: `<div class="fb ok"><p class="ttl">¡Orden perfecto!</p><p>Con estos pasos ya tienes el esqueleto de un resumen de 10.</p></div>`};
  return {frac, html: `<div class="fb ${frac >= .5 ? 'mid' : 'bad'}"><p class="ttl">${good} de ${item.items.length} en su sitio.</p>
    <p>Este es el orden correcto (✗ marca dónde te habías liado). Fíjate en la lógica: planteamiento → nudo → desenlace.</p>${list}${fichaLink(item.cid)}</div>`};
}
function checkMatch(item, vals) {
  let good = 0;
  const rows = item.rows.map((r, i) => { const ok = vals[i] === r.id; if (ok) good++;
    return `<li class="${ok ? 'si' : 'no'}"><span class="ic">${ok ? '✓' : '✗'}</span><div><i class="serif">«${esc(r.l)}»</i><div class="why">${ok ? 'Correcto: ' + esc(byId[r.id].corto) + '.' : `Es de <b>${esc(byId[r.id].corto)}</b> (${r.id})${vals[i] ? `, no de «${esc(byId[vals[i]].corto)}»` : ''}. Pista: ${esc(byId[r.id].ensenanzaCorta)}.`}</div></div></li>`; }).join('');
  const frac = good / item.rows.length;
  return {frac, html: `<div class="fb ${frac === 1 ? 'ok' : frac >= .6 ? 'mid' : 'bad'}"><p class="ttl">${frac === 1 ? rand(PRAISE) + ' Todas bien.' : `${good} de ${item.rows.length} bien.`}</p><ul class="ideas">${rows}</ul></div>`};
}

/* Respuesta escrita: busca ideas clave */
function analyzeWrite(item, text) {
  const t = norm(text);
  const matched = item.ideas.map(idea => idea.p.some(p => new RegExp(p).test(t)));
  // ¿mezcla con otro cuento?
  const own = new RegExp(byId[item.cid].claves).test(t);
  let mezcla = null;
  if (item.kind !== 'reflexión') for (const c of CUENTOS) {
    if (c.id === item.cid) continue;
    const m = t.match(new RegExp('\\b(' + c.claves + ')'));
    if (m && !own) { mezcla = {c, w: m[1]}; break; }
    if (m && ['queso', 'cuervo', 'zorra', 'lino', 'golondrina', 'miel', 'altramuces', 'perdices', 'illan', 'beguina', 'cerdo', 'coles', 'ciego'].some(w => m[0].startsWith(w))) { mezcla = {c, w: m[1]}; break; }
  }
  return {matched, n: words(text), mezcla, text};
}
function writeScore(item, a) {
  const ratio = a.matched.filter(Boolean).length / item.ideas.length;
  let f = 1; if (a.n < item.min * 0.5) f = 0.6; else if (a.n < item.min) f = 0.85;
  return Math.min(1, ratio * f);
}
function writeFeedbackHTML(item, a, idx) {
  const frac = writeScore(item, a), nota = frac * 10;
  const cls = nota >= 8 ? 'ok' : nota >= 5 ? 'mid' : 'bad';
  const ttl = nota >= 9 ? '¡Respuesta de sobresaliente!' : nota >= 8 ? '¡Muy bien! Estás cerca del 10.' : nota >= 5 ? 'Aprobado, pero te faltan ideas importantes.' : 'Faltan muchas ideas clave.';
  return `<div class="fb ${cls}" data-wf="${idx}">
    <div class="nota"><span class="big">${fmt(nota)}</span><span class="muted">/ 10 · ${a.n} palabras</span></div>
    <p class="ttl">${ttl}</p>
    ${a.mezcla ? `<p class="aviso">⚠️ Cuidado: has escrito «${esc(a.mezcla.w)}», que es del cuento «${esc(a.mezcla.c.corto)}» (${a.mezcla.c.id}). ¿Estás mezclando cuentos?</p>` : ''}
    ${a.n < item.min ? `<p class="aviso">Tu respuesta es corta (${a.n} palabras). ${item.kind === 'resumen' ? 'Un resumen de examen suele tener entre 60 y 120 palabras: planteamiento, nudo y desenlace.' : item.kind === 'enseñanza' ? 'Explica la enseñanza con al menos una o dos frases completas.' : 'Desarrolla tu opinión con argumentos y algún ejemplo.'}</p>` : ''}
    <p>Esto es lo que un profesor buscará en tu respuesta:</p>
    <ul class="ideas">${item.ideas.map((idea, i) => `<li class="${a.matched[i] ? 'si' : 'no'}"><span class="ic">${a.matched[i] ? '✓' : '✗'}</span><div><b>${esc(idea.t)}</b>${a.matched[i] ? '' : `<div class="why">${esc(idea.why)}</div><button class="link" data-yes="${i}" type="button">Sí lo he dicho, con otras palabras</button>`}</div></li>`).join('')}</ul>
    ${item.modelo ? `<details class="modelo" ${nota < 8 ? 'open' : ''}><summary>Ver una respuesta modelo</summary><p>${esc(item.modelo)}</p></details>` : `<p class="tip">No hay una única respuesta correcta: lo que cuenta es que tu opinión esté argumentada, tenga en cuenta la época del texto y ponga ejemplos.</p>`}
    ${item.kind === 'resumen' ? `<p class="tip">Recuerda: en tercera persona, con tus palabras, sin diálogos y en orden (planteamiento → nudo → desenlace). La moraleja no hace falta en el resumen, salvo que te la pidan.</p>` : ''}
  </div>`;
}
function bindWriteToggles(container, item, a, idx, onChange) {
  container.querySelectorAll(`[data-wf="${idx}"] [data-yes]`).forEach(b => b.onclick = () => {
    a.matched[+b.dataset.yes] = true;
    const box = container.querySelector(`[data-wf="${idx}"]`);
    box.outerHTML = writeFeedbackHTML(item, a, idx);
    bindWriteToggles(container, item, a, idx, onChange);
    bindFichaLinks(container);
    onChange(writeScore(item, a));
  });
}
function bindFichaLinks(root) { root.querySelectorAll('[data-ficha]').forEach(b => b.onclick = () => openFicha(b.dataset.ficha)); }

/* =========================================================
   REPRODUCTOR DE EJERCICIOS
   ========================================================= */
let Q = null;
function runQuiz(cfg) {
  Q = {title: cfg.title, items: cfg.items.filter(Boolean), i: 0, res: [], exam: !!cfg.exam, weights: cfg.weights || null, onEnd: cfg.onEnd};
  current = 'run';
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-current', b.dataset.go === (Q.exam ? 'examen' : 'practicar') ? 'page' : 'false'));
  renderQ();
}
function renderQ() {
  const item = Q.items[Q.i], n = Q.items.length;
  window.scrollTo(0, 0);
  app.innerHTML = `
  <div class="quiz">
    <div class="qhead">
      <div class="row" style="justify-content:space-between"><h1 class="h2" style="font-size:1.4rem">${esc(Q.title)}</h1><button class="btn ghost sm" id="salir" type="button">Salir</button></div>
      <div class="row" style="justify-content:space-between;font-size:.88rem"><span class="muted">Pregunta ${Q.i + 1} de ${n}</span>${Q.exam ? '<span class="muted">Modo examen: la corrección, al final</span>' : ''}</div>
      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${Q.i}"><i style="width:${Q.i / n * 100}%"></i></div>
    </div>
    <div class="qcard">
      ${tagHTML(item)}
      <p class="qtext">${esc(item.q)}${item.cita ? `<span class="cita">${esc(item.cita)}</span>` : ''}${item.sub ? `<br><b style="font-family:var(--f-ui);font-size:1rem">${esc(item.sub)}</b>` : ''}</p>
      <div id="ans"></div>
      <div class="row"><button class="btn primary" id="check" type="button" disabled>${Q.exam ? (Q.i === n - 1 ? 'Entregar examen' : 'Responder y seguir') : 'Comprobar'}</button><button class="btn" id="next" type="button" hidden>${Q.i === n - 1 ? 'Ver resultado' : 'Siguiente →'}</button></div>
      <div id="fb" aria-live="polite"></div>
    </div>
  </div>`;
  document.getElementById('salir').onclick = () => go(Q.exam ? 'examen' : 'practicar');
  const ans = document.getElementById('ans'), check = document.getElementById('check'), next = document.getElementById('next'), fb = document.getElementById('fb');
  let state = null;
  const L = 'ABCD';

  if (item.type === 'mc') {
    ans.innerHTML = `<div class="opts">${item.opts.map((o, i) => `<button class="opt" data-o="${i}" aria-pressed="false" type="button"><span class="l">${L[i]}</span><span>${esc(o.t)}</span></button>`).join('')}</div>`;
    ans.querySelectorAll('[data-o]').forEach(b => b.onclick = () => { state = +b.dataset.o; ans.querySelectorAll('[data-o]').forEach(x => x.setAttribute('aria-pressed', x === b)); check.disabled = false; });
  }
  if (item.type === 'tf') {
    ans.innerHTML = `<div class="tf"><button class="opt" data-v="1" aria-pressed="false" type="button">Verdadero</button><button class="opt" data-v="0" aria-pressed="false" type="button">Falso</button></div>`;
    ans.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { state = b.dataset.v === '1'; ans.querySelectorAll('[data-v]').forEach(x => x.setAttribute('aria-pressed', x === b)); check.disabled = false; });
  }
  if (item.type === 'gap') {
    ans.innerHTML = `<p class="gap-verso">${esc(item.txt).replace('______', '<b style="color:var(--rubric)">______</b>')}</p><label class="counter" for="gapin">Escribe la palabra que falta:</label><input class="field" id="gapin" autocomplete="off" autocapitalize="off" spellcheck="false">`;
    const inp = document.getElementById('gapin');
    inp.oninput = () => { state = inp.value; check.disabled = !inp.value.trim(); };
    inp.onkeydown = e => { if (e.key === 'Enter' && !check.disabled) check.click(); };
    setTimeout(() => inp.focus(), 50);
  }
  if (item.type === 'order') {
    let ord = shuffle(item.items); while (ord.every((t, i) => t === item.items[i])) ord = shuffle(item.items);
    state = ord; check.disabled = false;
    const draw = () => {
      ans.innerHTML = `<p class="counter">Usa las flechas para mover cada hecho a su sitio.</p><ol class="orden">${state.map((t, i) => `<li><span class="n">${i + 1}</span><span>${esc(t)}</span><span class="mv"><button type="button" data-up="${i}" ${i === 0 ? 'disabled' : ''} aria-label="Subir">↑</button><button type="button" data-dn="${i}" ${i === state.length - 1 ? 'disabled' : ''} aria-label="Bajar">↓</button></span></li>`).join('')}</ol>`;
      ans.querySelectorAll('[data-up]').forEach(b => b.onclick = () => { const i = +b.dataset.up; [state[i - 1], state[i]] = [state[i], state[i - 1]]; draw(); ans.querySelector(`[data-up="${i - 1}"]`)?.focus(); });
      ans.querySelectorAll('[data-dn]').forEach(b => b.onclick = () => { const i = +b.dataset.dn; [state[i + 1], state[i]] = [state[i], state[i + 1]]; draw(); ans.querySelector(`[data-dn="${i + 1}"]`)?.focus(); });
    };
    draw();
  }
  if (item.type === 'match') {
    state = item.rows.map(() => '');
    ans.innerHTML = `<div class="match">${item.rows.map((r, i) => `<div class="mrow"><p>«${esc(r.l)}»</p><select id="m${i}" data-m="${i}" aria-label="Cuento de la moraleja ${i + 1}"><option value="">Elige el cuento…</option>${item.choices.map(id => `<option value="${id}">${esc(byId[id].corto)} (${id})</option>`).join('')}</select></div>`).join('')}</div>`;
    ans.querySelectorAll('[data-m]').forEach(s => s.onchange = () => { state[+s.dataset.m] = s.value; check.disabled = state.some(v => !v); });
  }
  if (item.type === 'write') {
    ans.innerHTML = `<textarea class="field" id="wta" placeholder="${item.kind === 'resumen' ? 'Escribe aquí tu resumen, con tus palabras…' : item.kind === 'enseñanza' ? 'Escribe aquí qué enseña el cuento…' : 'Escribe aquí tu opinión razonada…'}"></textarea><div class="row" style="justify-content:space-between"><span class="counter" id="wc">0 palabras</span><span class="counter">${item.kind === 'resumen' ? 'Objetivo: 60-120 palabras' : item.kind === 'enseñanza' ? 'Objetivo: 20-60 palabras' : 'Objetivo: 50-120 palabras'}</span></div>`;
    const ta = document.getElementById('wta');
    ta.oninput = () => { state = ta.value; const n = words(ta.value); document.getElementById('wc').textContent = n + (n === 1 ? ' palabra' : ' palabras'); check.disabled = n < 3; };
    check.textContent = Q.exam ? check.textContent : 'Corregir';
  }

  check.onclick = () => {
    let r;
    if (item.type === 'mc') r = checkMC(item, state);
    if (item.type === 'tf') r = checkTF(item, state);
    if (item.type === 'gap') r = checkGap(item, state);
    if (item.type === 'order') r = checkOrder(item, state.slice());
    if (item.type === 'match') r = checkMatch(item, state.slice());
    let a = null;
    if (item.type === 'write') { a = analyzeWrite(item, state); r = {frac: writeScore(item, a), html: ''}; }
    const res = {item, frac: r.frac, html: r.html, a, answer: state};
    Q.res[Q.i] = res;
    record(item, r.frac);
    if (Q.exam) { advance(); return; }
    check.hidden = true; next.hidden = false;
    ans.querySelectorAll('button,input,textarea,select').forEach(el => el.disabled = true);
    if (item.type === 'mc') { ans.querySelectorAll('[data-o]').forEach(b => { const o = item.opts[+b.dataset.o]; if (o.ok) b.classList.add('is-ok'); else if (+b.dataset.o === state) b.classList.add('is-bad'); }); }
    if (item.type === 'tf') { ans.querySelectorAll('[data-v]').forEach(b => { const v = b.dataset.v === '1'; if (v === item.a) b.classList.add('is-ok'); else if (v === state) b.classList.add('is-bad'); }); }
    if (item.type === 'match') { ans.querySelectorAll('.mrow').forEach((row, i) => row.classList.add(state[i] === item.rows[i].id ? 'is-ok' : 'is-bad')); }
    if (item.type === 'write') {
      fb.innerHTML = writeFeedbackHTML(item, a, 0);
      bindWriteToggles(fb, item, a, 0, f => { res.frac = f; if (f >= 0.7) record({key: item.key}, f); });
    } else fb.innerHTML = r.html;
    bindFichaLinks(fb);
    next.focus({preventScroll: true});
    fb.scrollIntoView({behavior: 'smooth', block: 'nearest'});
  };
  next.onclick = advance;
}
function advance() { if (Q.i < Q.items.length - 1) { Q.i++; renderQ(); } else endQuiz(); }

function endQuiz() {
  if (Q.exam) { endExam(); return; }
  const total = Q.res.reduce((s, r) => s + (r ? r.frac : 0), 0), n = Q.items.length, nota = total / n * 10;
  const malos = Q.res.map((r, i) => ({r, i})).filter(x => x.r && x.r.frac < 0.7);
  app.innerHTML = `<div class="view"><section class="result">
    <span class="eyebrow">${esc(Q.title)}</span>
    <div class="score">${fmt(nota)}<small> / 10</small></div>
    <p class="lead">${nota >= 9 ? '¡Excelente! Patronio no lo habría explicado mejor.' : nota >= 7 ? 'Muy bien. Repasa los fallos y a por el 10.' : nota >= 5 ? 'Vas por buen camino, pero hay que repasar.' : 'Toca volver a las fichas y repetir. ¡Se aprende equivocándose!'}</p>
    ${malos.length ? `<h2 class="h3">Lo que has fallado (se ha guardado para repasar)</h2><div class="review">${malos.map(x => `<div class="ritem"><p class="rq">${esc(x.r.item.q)}</p>${x.r.item.type === 'write' ? writeFeedbackHTML(x.r.item, x.r.a, 'e' + x.i) : x.r.html}</div>`).join('')}</div>` : ''}
    <div class="row"><button class="btn primary" id="again" type="button">Repetir</button>${store.fallos.length ? `<button class="btn" id="fall" type="button">Repasar mis fallos (${store.fallos.length})</button>` : ''}<button class="btn ghost" id="back" type="button">Volver a practicar</button></div>
  </section></div>`;
  const items = Q.items.map(it => it.key ? buildKey(it.key) : buildKey('mm')), title = Q.title;
  document.getElementById('again').onclick = () => runQuiz({title, items});
  document.getElementById('back').onclick = () => go('practicar');
  const f = document.getElementById('fall'); if (f) f.onclick = startFallos;
  malos.forEach(x => { if (x.r.item.type === 'write') bindWriteToggles(app, x.r.item, x.r.a, 'e' + x.i, v => x.r.frac = v); });
  bindFichaLinks(app);
}

function startExam() {
  const ids = shuffle(IDS);
  const [rId, e1, e2, oId, gId] = ids;
  const obj = pick(allObjectiveKeys().filter(k => !k.startsWith('pr:')), 4);
  const items = [...obj.map(buildKey), buildKey('g:' + gId), buildKey('mm'), buildKey('o:' + oId), buildKey('wr:' + rId), buildKey('we:' + e1), buildKey('we:' + e2)];
  runQuiz({title: 'Simulacro de examen', items, exam: true, weights: [0.5, 0.5, 0.5, 0.5, 0.5, 1, 1, 2.5, 1.5, 1.5]});
}
function endExam() {
  const W = Q.weights;
  const total = () => Q.res.reduce((s, r, i) => s + (r ? r.frac * W[i] : 0), 0);
  const d = new Date();
  const entry = {nota: total(), fecha: d.toLocaleDateString('es-ES') + ' ' + d.toLocaleTimeString('es-ES', {hour: '2-digit', minute: '2-digit'})};
  store.examenes.push(entry); save();
  const itemHTML = (r, i) => {
    const it = r.item;
    let body = '';
    if (it.type === 'write') body = `<details class="modelo"><summary>Tu respuesta</summary><p class="serif">${esc(r.answer || '')}</p></details>` + writeFeedbackHTML(it, r.a, 'x' + i);
    else if (it.type === 'mc') { const ch = it.opts[r.answer]; body = (r.frac ? `<div class="fb ok"><p class="ttl">Bien: «${esc(ch.t)}»</p><p>${esc(ch.why)}</p></div>` : r.html); }
    else body = r.html;
    return `<div class="ritem"><div class="row" style="justify-content:space-between"><span class="pts" data-pts="${i}">${fmt(r.frac * W[i])} / ${fmt(W[i])} pts</span>${it.cid ? `<span class="pts">Exemplo ${it.cid}</span>` : ''}</div><p class="rq">${i + 1}. ${esc(it.q)}${it.cita ? ` <i>«${esc(it.cita)}»</i>` : ''}</p>${body}</div>`;
  };
  const render = () => {
    const nota = total();
    app.innerHTML = `<div class="view"><section class="result">
      <span class="eyebrow">Simulacro de examen · corrección</span>
      <div class="score" id="exNota">${fmt(nota)}<small> / 10</small></div>
      <p class="lead" id="exMsg">${msgNota(nota)}</p>
      <p class="muted" style="font-size:.9rem">En las preguntas escritas, si has dicho una idea con otras palabras, pulsa «Sí lo he dicho» y la nota se actualiza. Sé honesto: en el examen real no habrá botón.</p>
      <div class="review">${Q.res.map(itemHTML).join('')}</div>
      <div class="row"><button class="btn primary" id="again" type="button">Hacer otro simulacro</button><button class="btn ghost" id="back" type="button">Volver</button></div>
    </section></div>`;
    document.getElementById('again').onclick = startExam;
    document.getElementById('back').onclick = () => go('examen');
    Q.res.forEach((r, i) => { if (r.item.type === 'write') bindWriteToggles(app, r.item, r.a, 'x' + i, f => {
      r.frac = f; const n = total(); entry.nota = n; save();
      document.getElementById('exNota').innerHTML = `${fmt(n)}<small> / 10</small>`; document.getElementById('exMsg').textContent = msgNota(n);
      app.querySelector(`[data-pts="${i}"]`).textContent = `${fmt(f * W[i])} / ${fmt(W[i])} pts`;
    }); });
    bindFichaLinks(app);
  };
  render(); window.scrollTo(0, 0);
}
function msgNota(n) { return n >= 9.5 ? '¡Matrícula! Estás listo para el examen.' : n >= 9 ? '¡Sobresaliente! Pule los detalles y será un 10.' : n >= 7 ? 'Notable. Revisa lo que falta en las respuestas escritas.' : n >= 5 ? 'Aprobado. Repasa las fichas de los cuentos que has fallado.' : 'Todavía no. Vuelve a las fichas y a practicar por cuento: ¡lo vas a conseguir!'; }

go('inicio');
</script>
